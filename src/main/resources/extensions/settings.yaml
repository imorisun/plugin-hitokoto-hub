apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-hitokoto-hub-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          name: maxRandomLimit
          label: 最大随机条数
          value: 20
          validation: required|number|min:1|max:100
          help: 随机接口允许响应的最大句子数量
        - $formkit: number
          name: randomLimit
          label: 默认随机条数
          value: 1
          validation: required|number|min:1|max:100
          help: 随机接口默认返回的句子数量
        - $formkit: select
          name: defaultCategory
          label: 默认分类
          value: []
          multiple: true
          clearable: true
          autoSelect: false
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 可多选，随机接口默认筛选的分类。留空则返回全部分类。
        - $formkit: select
          name: encode
          label: 默认返回格式
          value: json
          options:
            - label: JSON
              value: json
            - label: 纯文本
              value: text
          help: 随机接口默认的返回格式
        - $formkit: number
          name: likeCooldown
          label: 点赞冷却时间（小时）
          value: 12
          validation: required|number|min:1|max:72
          help: 同一 IP 对同一句子两次点赞的间隔时间
        - $formkit: switch
          name: enableViewCount
          label: 启用浏览量统计
          value: true
          help: 随机获取句子时是否自动增加浏览量
        - $formkit: number
          name: statsMaxKeep
          label: 统计数据最大保留条数
          value: 1000
          validation: required|number|min:100|max:10000
          help: 超过此数量将自动删除最旧的数据
        - $formkit: number
          name: statsRetentionDays
          label: 统计数据保留天数
          value: 90
          validation: required|number|min:7|max:365
          help: 超过此天数的数据将被清理
    - group: ai
      label: AI设置
      formSchema:
        - $formkit: switch
          name: enableAiGenerate
          id: enableAiGenerate
          label: 启用 AI 生成
          value: false
          help: 开启后，定时任务将按设定的时间自动生成句子
          __raw__sectionsSchema:
            help:
              children:
                - $el: span
                  children: "启用后，轻言 将可以进行 AI 句子生成。此功能需要先安装并启用 "
                - $el: a
                  children: "Halo AI Foundation"
                  attrs:
                    href: "https://www.halo.run/store/apps/app-acslk9nu"
                    class: "block inline"
                    target: "_blank"
                    rel: "noopener noreferrer"
                    style:
                      color: "#1890ff"
                      whiteSpace: "pre"
                - $el: span
                  children: "（推荐应用），否则轻言将无法使用 AI 生成功能。"

        - $formkit: select
          name: aiCron
          label: 定时生成时间
          if: "$get(enableAiGenerate).value === true"
          value: "0 0 2 * * *"
          searchable: true
          allowCreate: true
          clearable: false
          options:
            - label: 每天凌晨 0 点
              value: "0 0 0 * * *"
            - label: 每天凌晨 2 点
              value: "0 0 2 * * *"
            - label: 每天早上 6 点
              value: "0 0 6 * * *"
            - label: 每天中午 12 点
              value: "0 0 12 * * *"
            - label: 每天晚上 8 点
              value: "0 0 20 * * *"
            - label: 每 1 小时
              value: "0 0 * * * *"
            - label: 每 6 小时
              value: "0 0 */6 * * *"
            - label: 每 12 小时
              value: "0 0 */12 * * *"
            - label: 每周一凌晨 0 点
              value: "0 0 0 * * 1"
            - label: 每月 1 号凌晨 0 点
              value: "0 0 0 1 * *"
          help: "AI 自动生成句子的时间，支持从预设中选择或手动输入 6 位 Cron 表达式（秒 分 时 日 月 周）"

        - $formkit: aiModelSelector
          name: languageModelName
          label: 语言模型
          modelType: language
          clearable: true
          placeholder: 请选择语言模型
          help: 选择用于生成句子的 AI 模型
          if: "$get(enableAiGenerate).value === true"

        - $formkit: textarea
          name: aiSystemPrompt
          label: 角色设定
          if: "$get(enableAiGenerate).value === true"
          value: |
            # 角色设定
            你是一位精通中文文学与美学的文字匠人，擅长以古典诗词的凝练、现代散文的流畅、以及哲学思辨的深度来锻造句子。
            
            ## 核心指令
            当用户给出一个主题、关键词、情境或情感时，你需要生成用户所要求的相对应数量的优美句子。每个句子必须：
            1. 语言凝练：剔除冗余，每个字都承担表意或节奏功能
            2. 意象鲜活：调动视觉、听觉、触觉、嗅觉、味觉等通感进行描写（可选）
            3. 情感有层次：不止于表面抒情，蕴含可回味的余韵
            4. 节奏有韵律：长短句交错，句内呼吸感自然
            
            ## 修辞要求
            - 通感、隐喻/暗喻、拟人化、矛盾修辞、时空折叠、微观放大
            
            现在，请根据用户输入生成优美句子。
          placeholder: 请输入 AI 角色设定
          help: AI 的角色设定（留空则使用默认角色设定）

        - $formkit: text
          name: aiTopic
          label: 生成主题
          if: "$get(enableAiGenerate).value === true"
          value: "温柔治愈"
          placeholder: 请输入生成主题
          help: 句子围绕的主题

        - $formkit: number
          name: aiSentenceCount
          label: 生成数量
          if: "$get(enableAiGenerate).value === true"
          value: "25"
          min: 1
          max: 100
          step: 1
          help: 每次生成的句子数量

        - $formkit: select
          name: aiSentenceCategory
          label: 目标分类
          if: "$get(enableAiGenerate).value === true"
          value:
          clearable: true
          autoSelect: true
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 句子保存到哪个分类

        - $formkit: switch
          name: aiSentenceAutoPublish
          label: 是否自动发布
          value: false
          help: 开启后，将自动发布AI生成的句子
          if: "$get(enableAiGenerate).value === true"
        - $formkit: number
          name: aiLogMaxKeep
          label: AI日志最大保留条数
          if: "$get(enableAiGenerate).value === true"
          value: 500
          validation: required|number|min:10|max:10000
          help: 超过此数量将自动删除最旧的AI生成日志
        - $formkit: number
          name: aiLogRetentionDays
          label: AI日志保留天数
          if: "$get(enableAiGenerate).value === true"
          value: 30
          validation: required|number|min:1|max:365
          help: 超过此天数的AI生成日志将被清理
    - group: submission
      label: 访客提交设置
      formSchema:
        - $formkit: switch
          name: enableSubmission
          id: enableSubmission
          label: 启用访客提交
          value: true
          help: 开启后，访客可在模板页面提交句子，管理员在后台审核
        - $formkit: select
          name: submissionDefaultCategory
          label: 默认提交分类
          if: "$get(enableSubmission).value === true"
          value:
          clearable: true
          autoSelect: true
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 访客提交句子时默认选中的分类（留空则让访客自行选择）
        - $formkit: switch
          name: submissionAutoPublish
          label: 审核通过后自动发布
          value: false
          if: "$get(enableSubmission).value === true"
          help: 开启后，审核通过的句子将自动发布；关闭则需手动发布
        - $formkit: number
          name: submissionBatchLimit
          label: 连续提交上限
          value: 3
          validation: required|number|min:1|max:20
          if: "$get(enableSubmission).value === true"
          help: 同一 IP 在冷却周期内可连续提交的句子数量，达到上限后进入冷却
        - $formkit: number
          name: submissionCooldown
          label: 提交冷却时间（分钟）
          value: 10
          validation: required|number|min:0|max:1440
          if: "$get(enableSubmission).value === true"
          help: 达到连续提交上限后的冷却时间；未达上限时单次提交也受此时间限制，0 表示不限制
        - $formkit: number
          name: submissionMaxKeep
          label: 提交记录最大保留条数
          value: 1000
          validation: required|number|min:100|max:10000
          if: "$get(enableSubmission).value === true"
          help: 超过此数量将自动删除最旧的已处理提交记录
    - group: similarity
      label: 相似度检查设置
      formSchema:
        - $formkit: switch
          name: enableScheduledCheck
          id: enableScheduledCheck
          label: 启用定时检查
          value: false
          help: 开启后，系统将按设定周期自动对所有句子进行相似度比对
        - $formkit: select
          name: similarityCron
          label: 定时检查时间
          if: "$get(enableScheduledCheck).value === true"
          value: "0 0 2 * * *"
          searchable: true
          allowCreate: true
          clearable: false
          options:
            - label: 每天凌晨 2 点
              value: "0 0 2 * * *"
            - label: 每周一凌晨 2 点
              value: "0 0 2 * * 1"
            - label: 每月 1 号凌晨 2 点
              value: "0 0 2 1 * *"
          help: "相似度检查的执行时间，支持从预设中选择或手动输入 6 位 Cron 表达式（秒 分 时 日 月 周）"
        - $formkit: select
          name: similarityAlgorithm
          label: 相似度算法
          if: "$get(enableScheduledCheck).value === true"
          value: COSINE
          options:
            - label: 余弦相似度（TF-IDF）
              value: COSINE
            - label: Jaccard 相似度
              value: JACCARD
          help: "余弦相似度基于 TF-IDF 加权的字符二元组向量，适合检测语义接近的句子；Jaccard 相似度基于字符二元组集合的重叠率，适合检测高度相似的句子"
        - $formkit: number
          name: similarityThreshold
          label: 相似度阈值
          if: "$get(enableScheduledCheck).value === true"
          value: 0.8
          min: 0.1
          max: 1.0
          step: 0.05
          help: "超过此阈值的句子对将被标记为相似（0~1 之间，越大越严格）"