apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-hitokoto-hub-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          name: maxRandomLimit
          label: 最大随机条数
          value: 20
          validation: required|number|min:1|max:100
          help: 随机接口允许响应的最大句子数量
        - $formkit: number
          name: randomLimit
          label: 默认随机条数
          value: 1
          validation: required|number|min:1|max:100
          help: 随机接口默认返回的句子数量
        - $formkit: select
          name: defaultCategory
          label: 默认分类
          value: []
          multiple: true
          clearable: true
          autoSelect: false
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 可多选，随机接口默认筛选的分类。留空则返回全部分类。
        - $formkit: select
          name: encode
          label: 默认返回格式
          value: json
          options:
            - label: JSON
              value: json
            - label: 纯文本
              value: text
          help: 随机接口默认的返回格式
        - $formkit: number
          name: likeCooldown
          label: 点赞冷却时间（小时）
          value: 12
          validation: required|number|min:1|max:72
          help: 同一 IP 对同一句子两次点赞的间隔时间
        - $formkit: switch
          name: enableViewCount
          label: 启用浏览量统计
          value: true
          help: 随机获取句子时是否自动增加浏览量
        - $formkit: number
          name: statsMaxKeep
          label: 统计数据最大保留条数
          value: 1000
          validation: required|number|min:100|max:10000
          help: 超过此数量将自动删除最旧的数据
        - $formkit: number
          name: statsRetentionDays
          label: 统计数据保留天数
          value: 90
          validation: required|number|min:7|max:365
          help: 超过此天数的数据将被清理
    - group: ai
      label: AI设置
      formSchema:
        - $formkit: switch
          name: enableAiGenerate
          id: enableAiGenerate
          label: 启用 AI 自动生成
          value: false
          help: 开启后，定时任务将按设定的时间自动生成句子；关闭后仍可在后台手动生成
          __raw__sectionsSchema:
            help:
              children:
                - $el: span
                  children: "开启后，轻言 将按设定时间定时自动生成句子（关闭仅影响自动生成，手动生成不受影响）。此功能需要先安装并启用 "
                - $el: a
                  children: "Halo AI Foundation"
                  attrs:
                    href: "https://www.halo.run/store/apps/app-acslk9nu"
                    class: "block inline"
                    target: "_blank"
                    rel: "noopener noreferrer"
                    style:
                      color: "#1890ff"
                      whiteSpace: "pre"
                - $el: span
                  children: "（推荐应用），否则轻言将无法使用 AI 生成功能。"

        - $formkit: select
          name: aiCron
          label: 自动生成时间
          if: "$get(enableAiGenerate).value === true"
          value: "0 0 2 * * *"
          searchable: true
          allowCreate: true
          clearable: false
          options:
            - label: 每天凌晨 0 点
              value: "0 0 0 * * *"
            - label: 每天凌晨 2 点
              value: "0 0 2 * * *"
            - label: 每天早上 6 点
              value: "0 0 6 * * *"
            - label: 每天中午 12 点
              value: "0 0 12 * * *"
            - label: 每天晚上 8 点
              value: "0 0 20 * * *"
            - label: 每 1 小时
              value: "0 0 * * * *"
            - label: 每 6 小时
              value: "0 0 */6 * * *"
            - label: 每 12 小时
              value: "0 0 */12 * * *"
            - label: 每周一凌晨 0 点
              value: "0 0 0 * * 1"
            - label: 每月 1 号凌晨 0 点
              value: "0 0 0 1 * *"
          help: "AI 自动生成句子的时间，支持从预设中选择或手动输入 6 位 Cron 表达式（秒 分 时 日 月 周）"

        - $formkit: aiModelSelector
          name: languageModelName
          label: 语言模型
          modelType: language
          clearable: true
          placeholder: 请选择语言模型
          help: 选择用于生成句子的 AI 模型

        - $formkit: textarea
          name: aiSystemPrompt
          label: 角色设定
          value: |
            # 角色
            你是一位资深中文文学创作匠人，融合古典诗词的凝练、现代散文的流畅与哲学思辨的深度，擅长围绕任意主题锻造高质量的"一句话"作品。

            # 任务
            根据给定的主题与数量，创作优美且彼此独立的句子。每条句子需同时包含正文、作者、来源三个字段。

            # 创作准则
            1. 语言凝练：字字表意，剔除冗余修饰与口语化表达，单条正文控制在 8~40 字之间。
            2. 意象鲜活：调动通感、隐喻、拟人等修辞，营造可感知的画面感。
            3. 情感层次：不止于直白抒情，留有余韵与回味的空间。
            4. 节奏韵律：长短句交错，句内呼吸感自然，可朗读。
            5. 独立成句：每条句子独立完整，不依赖上下文，且彼此互不重复。
            6. 拒绝陈词滥调：避免网络流行语、常见鸡汤金句与对名言的直接改写。

            # 作者与来源
            - 原创：作者填"佚名"，来源填"原创"。
            - 化用：若化用经典，作者填原出处作者，来源填具体作品名（如《人间词话》）。
            - 不得凭空杜撰真实人物未说过的言论。

            # 输出
            严格输出 JSON 数组，每个元素包含 content（正文）、author（作者）、source（来源）三个字符串字段，数量与用户要求一致，不要附加任何解释性文字。
          placeholder: 请输入 AI 角色设定
          help: AI 的角色设定（留空则使用默认角色设定）

        - $formkit: text
          name: aiTopic
          label: 生成主题
          value: "温柔治愈"
          placeholder: 请输入生成主题
          help: 句子围绕的主题

        - $formkit: number
          name: aiSentenceCount
          label: 生成数量
          value: 25
          min: 1
          max: 100
          step: 1
          validation: required|number|min:1|max:100
          help: 每次生成的句子数量

        - $formkit: select
          name: aiSentenceCategory
          label: 目标分类
          value:
          clearable: true
          autoSelect: true
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 句子保存到哪个分类

        - $formkit: switch
          name: aiSentenceAutoPublish
          label: 是否自动发布
          value: false
          help: 开启后，将自动发布AI生成的句子
        - $formkit: number
          name: aiLogMaxKeep
          label: AI日志最大保留条数
          value: 500
          validation: required|number|min:10|max:10000
          help: 超过此数量将自动删除最旧的AI生成日志
        - $formkit: number
          name: aiLogRetentionDays
          label: AI日志保留天数
          value: 30
          validation: required|number|min:1|max:365
          help: 超过此天数的AI生成日志将被清理
    - group: submission
      label: 访客提交设置
      formSchema:
        - $formkit: switch
          name: enableSubmission
          id: enableSubmission
          label: 启用访客提交
          value: true
          help: 开启后，访客可在模板页面提交句子，管理员在后台审核
        - $formkit: select
          name: submissionDefaultCategory
          label: 默认提交分类
          if: "$get(enableSubmission).value === true"
          value:
          clearable: true
          autoSelect: true
          action: /apis/hitokotohub.puresky.top/v1alpha1/categories
          requestOption:
            method: GET
            labelField: spec.name
            valueField: metadata.name
          help: 访客提交句子时默认选中的分类（留空则让访客自行选择）
        - $formkit: switch
          name: submissionAutoPublish
          label: 审核通过后自动发布
          value: false
          if: "$get(enableSubmission).value === true"
          help: 开启后，审核通过的句子将自动发布；关闭则需手动发布
        - $formkit: number
          name: submissionBatchLimit
          label: 连续提交上限
          value: 3
          validation: required|number|min:1|max:20
          if: "$get(enableSubmission).value === true"
          help: 同一 IP 在冷却周期内可连续提交的句子数量，达到上限后进入冷却
        - $formkit: number
          name: submissionCooldown
          label: 提交冷却时间（分钟）
          value: 10
          validation: required|number|min:0|max:1440
          if: "$get(enableSubmission).value === true"
          help: 达到连续提交上限后的冷却时间；未达上限时单次提交也受此时间限制，0 表示不限制
        - $formkit: number
          name: submissionMaxKeep
          label: 提交记录最大保留条数
          value: 1000
          validation: required|number|min:100|max:10000
          help: 超过此数量将自动删除最旧的已处理提交记录
    - group: similarity
      label: 相似度检查设置
      formSchema:
        - $formkit: switch
          name: enableScheduledCheck
          id: enableScheduledCheck
          label: 启用定时检查
          value: false
          help: 开启后，系统将按设定周期自动对所有句子进行相似度比对
        - $formkit: select
          name: similarityCron
          label: 定时检查时间
          if: "$get(enableScheduledCheck).value === true"
          value: "0 0 2 * * *"
          searchable: true
          allowCreate: true
          clearable: false
          options:
            - label: 每天凌晨 2 点
              value: "0 0 2 * * *"
            - label: 每周一凌晨 2 点
              value: "0 0 2 * * 1"
            - label: 每月 1 号凌晨 2 点
              value: "0 0 2 1 * *"
          help: "相似度检查的执行时间，支持从预设中选择或手动输入 6 位 Cron 表达式（秒 分 时 日 月 周）"
        - $formkit: select
          name: similarityAlgorithm
          label: 相似度算法
          if: "$get(enableScheduledCheck).value === true"
          value: COSINE
          options:
            - label: 余弦相似度（TF-IDF）
              value: COSINE
            - label: Jaccard 相似度
              value: JACCARD
          help: "余弦相似度基于 TF-IDF 加权的字符二元组向量，适合检测语义接近的句子；Jaccard 相似度基于字符二元组集合的重叠率，适合检测高度相似的句子"
        - $formkit: number
          name: similarityThreshold
          label: 相似度阈值
          if: "$get(enableScheduledCheck).value === true"
          value: 0.8
          min: 0.1
          max: 1.0
          step: 0.05
          help: "超过此阈值的句子对将被标记为相似（0~1 之间，越大越严格）"
    - group: template
      label: 模板展示设置
      formSchema:
        - $formkit: select
          name: templateTheme
          label: 默认主题
          value: auto
          options:
            - label: 跟随系统
              value: auto
            - label: 暗色模式
              value: dark
            - label: 亮色模式
              value: light
          help: 访客首次访问时展示的主题配色；若访客手动切换过主题，则以访客的选择为准
        - $formkit: switch
          name: templateShowSakura
          label: 显示花瓣飘落动画
          value: true
          help: 关闭后，模板页面将不展示花瓣飘落背景动画
        - $formkit: switch
          name: templateShowHint
          label: 显示首次操作提示
          value: true
          help: 开启后，页面加载完成时将显示"双击屏幕任意位置点赞"的操作提示
        - $formkit: switch
          name: enableAutoRefresh
          id: enableAutoRefresh
          label: 定时自动切换句子
          value: false
          help: 开启后，页面将按照设定的时间间隔自动切换展示新的句子
        - $formkit: number
          name: autoRefreshInterval
          label: 自动切换间隔（秒）
          if: "$get(enableAutoRefresh).value === true"
          value: 10
          min: 3
          max: 3600
          step: 1
          help: 句子自动切换的时间间隔，单位为秒，最小 3 秒，最大 3600 秒（1 小时）
    - group: share
      label: 分享设置
      formSchema:
        - $formkit: text
          name: siteName
          label: 站点名称
          value: 轻言
          placeholder: 请输入站点名称
          help: 展示在分享卡片上的站点名称；留空则使用 Halo 站点标题