<!--
  iOS 液态玻璃模板（hitokoto-glass）脚本 fragment。
  职责：主题切换、滚动视差、光线折射、分类联动、卡片渲染、点赞、复制分享链接、访客投递。
  通过 <th:block th:replace="~{hitokoto-glass-scripts :: scripts}"/> 引用；
  其中 theme-init 必须单独引在 <head> 里。
-->

<!--
  首屏主题预设：**必须**放在 <head> 中同步执行。
  若等到 body 末尾的 scripts 才切换主题，浏览器会先用默认的暗色画一帧、再由脚本改成亮色，
  表现为"每次打开都先黑一下"的闪烁。这里只做最小必要的事：
  读偏好 → 定明暗 → 立刻写到 <html> 上，不碰 DOM、不注册监听。
-->
<th:block th:fragment="theme-init" xmlns:th="http://www.thymeleaf.org">
<script>
    (function () {
        'use strict';
        var html = document.documentElement;
        /* 与下方 THEME_KEY 保持一致：两段脚本各自独立执行，无法共享变量 */
        var mode = null;
        try {
            mode = localStorage.getItem('hitokoto:theme');
        } catch (e) { /* 隐私模式下 localStorage 不可用，回落到服务端默认值 */ }
        if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') {
            mode = html.getAttribute('data-default-theme') || 'auto';
        }
        var actual = (mode === 'dark' || mode === 'light') ? mode
            : ((window.matchMedia
                && window.matchMedia('(prefers-color-scheme: light)').matches)
                ? 'light' : 'dark');
        if (actual === 'light') {
            html.setAttribute('data-theme', 'light');
        }
    })();
</script>
</th:block>

<th:block th:fragment="scripts" xmlns:th="http://www.thymeleaf.org">
<script>
    (function () {
        'use strict';

        /* ==================== 常量 ==================== */
        var API_BASE = '/apis/public.api.hitokotohub.puresky.top/v1alpha1';
        var RANDOM_API = API_BASE + '/sentence/random';
        var LIKE_API = API_BASE + '/sentence/like';
        var CATEGORY_API = API_BASE + '/category/list';
        var SUBMISSION_CONFIG_API = API_BASE + '/sentence-submission/config';
        var SUBMIT_API = API_BASE + '/sentence-submission/-/submit';
        /* 与其余模板共用偏好键，各模板间主题/分类选择互通 */
        var THEME_KEY = 'hitokoto:theme';
        var CATEGORY_KEY = 'hitokoto:category';
        var PAGE_SIZE = 12;

        /* ==================== 主题切换（dark → light → auto 循环） ==================== */
        (function () {
            var html = document.documentElement;

            /* 服务端默认主题挂在 <html data-default-theme> 上，head 的 theme-init 读的是同一个值 */
            function getServerDefaultTheme() {
                return html.getAttribute('data-default-theme') || 'auto';
            }

            function getStoredTheme() {
                try {
                    var stored = localStorage.getItem(THEME_KEY);
                    if (stored === 'light' || stored === 'dark' || stored === 'auto') {
                        return stored;
                    }
                } catch (e) { /* localStorage 不可用时静默处理 */ }
                return null;
            }

            function resolveActualTheme(mode) {
                if (mode === 'dark' || mode === 'light') return mode;
                if (window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    return 'light';
                }
                return 'dark';
            }

            function applyTheme(actual) {
                if (actual === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
                /* 同步移动端浏览器顶栏颜色（与玻璃模板的底色保持一致） */
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.setAttribute('content',
                        actual === 'light' ? '#e9edfa' : '#06060b');
                }
            }

            function updateToggleVisual() {
                var btn = document.getElementById('themeToggle');
                if (!btn) return;
                var mode = getStoredTheme();
                btn.classList.toggle('theme-toggle--auto', mode === 'auto');
                var label = mode === 'auto' ? '主题：跟随系统'
                    : (mode === 'dark' ? '主题：暗色模式' : '主题：亮色模式');
                btn.setAttribute('aria-label', label + '，点击切换');
                btn.setAttribute('title', label);
            }

            var stored = getStoredTheme();
            if (!stored) {
                stored = getServerDefaultTheme() || 'auto';
                try { localStorage.setItem(THEME_KEY, stored); } catch (e) {}
            }
            applyTheme(resolveActualTheme(stored));
            updateToggleVisual();

            /* auto 模式下跟随系统主题变化 */
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                if (mq.addEventListener) {
                    mq.addEventListener('change', function (e) {
                        var mode = getStoredTheme();
                        if (mode === 'auto' || !mode) {
                            applyTheme(e.matches ? 'dark' : 'light');
                        }
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                var btn = document.getElementById('themeToggle');
                if (!btn) return;
                btn.addEventListener('click', function () {
                    var mode = getStoredTheme() || 'dark';
                    var next = mode === 'dark' ? 'light'
                        : (mode === 'light' ? 'auto' : 'dark');
                    applyTheme(resolveActualTheme(next));
                    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
                    updateToggleVisual();
                });
            });
        })();

        /* ==================== 滚动视差与指针牵引 ==================== */
        /* 背景光斑既随滚动缓慢上移（纵深），又被指针轻轻"拖"动（液面受力）。
           两者合并到同一个 rAF 里读写，只改 transform，避免触发布局重排 */
        (function () {
            if (window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return;
            }
            var scene = document.querySelector('.glass-scene');
            if (!scene) return;
            var scrollY = window.pageYOffset
                || document.documentElement.scrollTop || 0;
            var px = 0;   /* 指针归一化横向偏移（-1 ~ 1） */
            var py = 0;   /* 指针归一化纵向偏移 */
            var ticking = false;

            function update() {
                ticking = false;
                scene.style.transform = 'translate3d(' + (px * 14).toFixed(2) + 'px,'
                    + (-scrollY * 0.05 + py * 14).toFixed(2) + 'px,0)';
            }

            function schedule() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(update);
            }

            window.addEventListener('scroll', function () {
                scrollY = window.pageYOffset
                    || document.documentElement.scrollTop || 0;
                schedule();
            }, { passive: true });

            if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
                window.addEventListener('pointermove', function (e) {
                    px = (e.clientX / window.innerWidth - 0.5) * 2;
                    py = (e.clientY / window.innerHeight - 0.5) * 2;
                    schedule();
                }, { passive: true });
            }
        })();

        /* ==================== 光线折射与液面倾斜 ==================== */
        /* 仅在有悬停能力的设备上启用；rAF 合并高频 pointermove，只写 CSS 变量。
           卡片额外做 3D 倾斜，让指针划过时像抚过一层会晃动的液面。 */
        (function () {
            if (!window.matchMedia || !window.matchMedia('(hover: hover)').matches) {
                return;
            }
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return;
            }
            var MAX_TILT = 6;
            /* 指针落点的柔光对卡片、聚光卡片与所有控件都生效 */
            var GLINT_CLASSES = ['glass-card', 'glass-spotlight',
                'btn', 'icon-btn', 'glass-tab', 'glass-refresh'];
            var raf = null;
            var pending = null;

            function hasGlint(node) {
                var list = node.classList;
                if (!list) return false;
                for (var i = 0; i < GLINT_CLASSES.length; i++) {
                    if (list.contains(GLINT_CLASSES[i])) return true;
                }
                return false;
            }

            document.addEventListener('pointermove', function (e) {
                if (!e.target || !e.target.closest) return;
                if (!e.target.closest('.glass-card, .glass-spotlight,'
                    + ' .btn, .icon-btn, .glass-tab, .glass-refresh')) return;
                pending = { target: e.target, x: e.clientX, y: e.clientY };
                if (raf) return;
                raf = requestAnimationFrame(function () {
                    raf = null;
                    var p = pending;
                    if (!p) return;
                    /* 由内向外整条祖先链都写一遍：控件嵌在卡片里时，
                       两者各自的高光都能跟上指针，不会有一方"卡住" */
                    var node = p.target;
                    while (node && node !== document.body) {
                        if (hasGlint(node)) {
                            var rect = node.getBoundingClientRect();
                            if (rect.width && rect.height) {
                                var px = (p.x - rect.left) / rect.width;
                                var py = (p.y - rect.top) / rect.height;
                                node.style.setProperty('--mx', (px * 100) + '%');
                                node.style.setProperty('--my', (py * 100) + '%');
                                /* 倾斜只作用于网格卡片：聚光卡片体量大，
                                   倾斜会干扰长句阅读 */
                                if (node.classList.contains('glass-card')) {
                                    node.style.setProperty('--ry',
                                        ((px - 0.5) * MAX_TILT * 2).toFixed(2) + 'deg');
                                    node.style.setProperty('--rx',
                                        ((0.5 - py) * MAX_TILT * 2).toFixed(2) + 'deg');
                                }
                            }
                        }
                        node = node.parentElement;
                    }
                });
            }, { passive: true });

            /* 指针离开卡片后把倾斜归零，避免下次悬停时残留上一次的角度 */
            document.addEventListener('pointerout', function (e) {
                if (!e.target || !e.target.closest) return;
                var target = e.target.closest('.glass-card');
                if (!target) return;
                if (e.relatedTarget && target.contains(e.relatedTarget)) return;
                target.style.setProperty('--rx', '0deg');
                target.style.setProperty('--ry', '0deg');
            }, { passive: true });
        })();

        /* ==================== 按压涟漪 ==================== */
        /* 从触点扩散的液面涟漪：只动 transform/opacity，可合成、无重排 */
        (function () {
            if (window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return;
            }
            var SELECTOR = '.glass-tab, .glass-refresh, .btn, .icon-btn';

            document.addEventListener('pointerdown', function (e) {
                if (!e.target || !e.target.closest) return;
                var host = e.target.closest(SELECTOR);
                if (!host || host.disabled) return;
                var rect = host.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                /* 触点同时充当缩放原点：形变从指尖处"陷"下去再回弹，
                   比固定从中心缩放更像按在液面上 */
                host.style.setProperty('--ox',
                    ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%');
                host.style.setProperty('--oy',
                    ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%');
                var size = Math.max(rect.width, rect.height) * 1.8;
                var ripple = document.createElement('span');
                ripple.className = 'glass-ripple';
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                host.appendChild(ripple);
                setTimeout(function () {
                    if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
                }, 700);
            }, { passive: true });
        })();

        /* ==================== 通用工具 ==================== */
        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function formatCount(n) {
            n = Number(n) || 0;
            if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return String(n);
        }

        function likedKey(name) {
            return 'hitokoto:liked:' + name;
        }

        function isLiked(name) {
            try { return localStorage.getItem(likedKey(name)) === '1'; } catch (e) {
                return false;
            }
        }

        function setLiked(name, liked) {
            try {
                if (liked) localStorage.setItem(likedKey(name), '1');
                else localStorage.removeItem(likedKey(name));
            } catch (e) { /* localStorage 不可用时静默处理 */ }
        }

        var toastTimer = null;
        function showToast(message) {
            var toast = document.getElementById('toast');
            if (!toast) return;
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('is-visible');
            toastTimer = setTimeout(function () {
                toast.classList.remove('is-visible');
            }, 2400);
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
                throw new Error('clipboard api unavailable');
            } catch (e) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    var ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    return ok;
                } catch (e2) {
                    return false;
                }
            }
        }

        /* ==================== 卡片图标 ==================== */
        var SVG_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
        var SVG_LINK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';

        /* ==================== 句子网格 ==================== */
        var grid = null;
        var emptyState = null;
        var refreshBtn = null;
        var tabsEl = null;
        var currentCategory = '';
        var loadingGrid = false;

        /* 归属信息：作者 + 可点击出处（复用聚光卡片与网格卡片的结构） */
        function buildCitation(s) {
            var citation = el('div', 'glass-citation');
            citation.appendChild(el('span', 'glass-citation__author',
                s.author ? s.author : '佚名'));
            if (s.source) {
                var sourceText = '《' + String(s.source).replace(/[《》]/g, '') + '》';
                if (s.jumpUrl) {
                    var sourceLink = el('a', 'glass-citation__source', sourceText);
                    sourceLink.href = s.jumpUrl;
                    sourceLink.target = '_blank';
                    sourceLink.rel = 'noopener';
                    citation.appendChild(sourceLink);
                } else {
                    citation.appendChild(
                        el('span', 'glass-citation__source', sourceText));
                }
            }
            return citation;
        }

        /* 点赞 + 复制：聚光卡片与网格卡片共用同一套结构 */
        function buildActions(s, name) {
            var actions = el('div', 'glass-actions');

            var likeBtn = el('button', 'icon-btn card-like');
            likeBtn.type = 'button';
            likeBtn.setAttribute('aria-label', '点赞');
            likeBtn.innerHTML = SVG_HEART;
            var count = el('span', 'card-like__count', formatCount(s.likeCount));
            count.setAttribute('data-likes', s.likeCount || 0);
            likeBtn.appendChild(count);

            /* 优先使用服务端返回的 hasLiked（基于 IP 判断），并同步本地记录 */
            var liked = (typeof s.hasLiked === 'boolean') ? s.hasLiked : isLiked(name);
            if (liked) {
                likeBtn.classList.add('is-liked');
                likeBtn.setAttribute('aria-label', '已点赞，点击取消');
            }
            setLiked(name, liked);

            var copyBtn = el('button', 'icon-btn card-copy');
            copyBtn.type = 'button';
            copyBtn.setAttribute('aria-label', '复制分享链接');
            copyBtn.setAttribute('title', '复制分享链接');
            copyBtn.innerHTML = SVG_LINK;

            actions.appendChild(likeBtn);
            actions.appendChild(copyBtn);
            return actions;
        }

        function buildCard(s, index) {
            var name = s.metaName || s.name || '';
            var card = el('article', 'glass-card glass');
            card.setAttribute('data-name', name);
            /* --stagger 与 SSR 卡片一致：错峰入场，形成流体般的逐个浮现 */
            card.style.setProperty('--stagger', Math.min(index * 55, 660) + 'ms');

            var content = el('p', 'glass-card__content', s.content || '');

            var footer = el('div', 'glass-card__footer');
            footer.appendChild(buildCitation(s));
            footer.appendChild(buildActions(s, name));

            card.appendChild(content);
            card.appendChild(footer);
            return card;
        }

        function setGridLoading(loading) {
            loadingGrid = loading;
            if (grid) grid.classList.toggle('is-loading', loading);
            if (refreshBtn) refreshBtn.classList.toggle('is-loading', loading);
        }

        function showEmpty() {
            grid.innerHTML = '';
            var title = document.getElementById('gridEmptyTitle');
            if (title) {
                title.textContent = currentCategory
                    ? '这个分类还没有句子' : '这里还没有句子';
            }
            if (emptyState) emptyState.classList.add('is-visible');
        }

        function renderGrid(list) {
            if (emptyState) emptyState.classList.remove('is-visible');
            grid.innerHTML = '';
            if (!list || list.length === 0) {
                showEmpty();
                return;
            }
            var frag = document.createDocumentFragment();
            for (var i = 0; i < list.length; i++) {
                frag.appendChild(buildCard(list[i], i));
            }
            grid.appendChild(frag);
        }

        async function loadSentences() {
            if (loadingGrid) return;
            setGridLoading(true);
            try {
                var url = RANDOM_API + '?limit=' + PAGE_SIZE;
                if (currentCategory) {
                    url += '&categoryName=' + encodeURIComponent(currentCategory);
                }
                var res = await fetch(url);
                if (!res.ok) throw new Error('fetch failed');
                var data = await res.json();
                renderGrid((data && data.sentences) || []);
            } catch (e) {
                showToast('加载失败，请稍后再试');
            } finally {
                setGridLoading(false);
            }
        }

        /* ==================== 分类切换 ==================== */
        function getStoredCategory() {
            try { return localStorage.getItem(CATEGORY_KEY) || ''; } catch (e) {
                return '';
            }
        }

        function setStoredCategory(cat) {
            try {
                if (cat) localStorage.setItem(CATEGORY_KEY, cat);
                else localStorage.removeItem(CATEGORY_KEY);
            } catch (e) { /* localStorage 不可用时静默处理 */ }
        }

        function markActiveTab(cat) {
            if (!tabsEl) return;
            var tabs = tabsEl.querySelectorAll('.glass-tab');
            for (var i = 0; i < tabs.length; i++) {
                var active = (tabs[i].getAttribute('data-cat') || '') === cat;
                tabs[i].classList.toggle('is-active', active);
                tabs[i].setAttribute('aria-pressed', active ? 'true' : 'false');
            }
        }

        function selectCategory(cat) {
            currentCategory = cat || '';
            setStoredCategory(currentCategory);
            markActiveTab(currentCategory);
            loadSentences();
        }

        /* ==================== 点赞与分享链接（事件委托，覆盖 SSR 与 JS 渲染的卡片） ==================== */
        async function handleLike(btn) {
            var card = btn.closest('[data-name]');
            if (!card) return;
            var name = card.getAttribute('data-name');
            if (!name || btn.dataset.busy === '1') return;
            btn.dataset.busy = '1';
            var action = btn.classList.contains('is-liked') ? 'unlike' : 'like';
            try {
                var res = await fetch(LIKE_API + '?name=' + encodeURIComponent(name)
                    + '&action=' + action);
                var data = await res.json();
                if (data.success && data.sentence) {
                    /* 服务端返回的 hasLiked 为操作后的真实状态 */
                    var liked = data.sentence.hasLiked === true;
                    setLiked(name, liked);
                    btn.classList.toggle('is-liked', liked);
                    btn.setAttribute('aria-label',
                        liked ? '已点赞，点击取消' : '点赞');
                    var countEl = btn.querySelector('.card-like__count');
                    if (countEl) {
                        countEl.textContent = formatCount(data.sentence.likeCount || 0);
                        countEl.classList.remove('pop');
                        void countEl.offsetWidth; /* 重置动画 */
                        countEl.classList.add('pop');
                    }
                } else {
                    showToast(data.message || '操作过于频繁，请稍后再试');
                }
            } catch (e) {
                showToast('网络异常，请稍后再试');
            } finally {
                btn.dataset.busy = '';
            }
        }

        async function handleCopy(btn) {
            var card = btn.closest('[data-name]');
            if (!card) return;
            var name = card.getAttribute('data-name');
            if (!name) return;
            /* 与后端 SharePayload.sharePath 规则一致：/hitokoto?sentence={name} */
            var link = window.location.origin
                + '/hitokoto?sentence=' + encodeURIComponent(name);
            var ok = await copyToClipboard(link);
            showToast(ok ? '分享链接已复制' : '复制失败，请手动复制');
        }

        /* ==================== 访客提交 ==================== */
        var submitModal = null;
        var submitForm = null;
        var submitContent = null;
        var submitContentCount = null;
        var submitCategory = null;
        var submitConfirmBtn = null;
        var submitBtn = null;
        var submitCategoriesLoaded = false;
        var submitting = false;
        var submissionDefaultCategory = '';
        /* 记录打开弹窗前的焦点元素，关闭后返回焦点 */
        var modalLastFocused = null;

        /* 投递入口是否渲染由服务端决定：按钮不存在说明功能未开启，无需再拉配置 */
        async function loadSubmissionConfig() {
            if (!submitBtn) return;
            try {
                var res = await fetch(SUBMISSION_CONFIG_API);
                var data = await res.json();
                if (data.defaultCategory) {
                    submissionDefaultCategory = data.defaultCategory;
                }
            } catch (e) { /* 配置获取失败时沿用空默认分类，提交接口会兜底校验 */ }
        }

        async function loadSubmitCategories() {
            if (!submitCategory) return;
            submitCategory.innerHTML =
                '<option value="" disabled selected>加载中...</option>';
            try {
                var res = await fetch(CATEGORY_API);
                if (!res.ok) throw new Error('fetch failed');
                var list = await res.json();
                submitCategory.innerHTML = '';
                if (!list || list.length === 0) {
                    submitCategory.innerHTML =
                        '<option value="" disabled selected>暂无可选分类</option>';
                    return;
                }
                var placeholder = el('option', null, '请选择分类');
                placeholder.value = '';
                placeholder.disabled = true;
                placeholder.selected = !submissionDefaultCategory;
                submitCategory.appendChild(placeholder);
                list.forEach(function (c) {
                    var opt = el('option', null, c.displayName);
                    opt.value = c.name;
                    if (submissionDefaultCategory && c.name === submissionDefaultCategory) {
                        opt.selected = true;
                    }
                    submitCategory.appendChild(opt);
                });
                submitCategoriesLoaded = true;
                validateSubmitForm();
            } catch (e) {
                submitCategory.innerHTML =
                    '<option value="" disabled selected>分类加载失败</option>';
            }
        }

        function validateSubmitForm() {
            if (!submitConfirmBtn) return;
            submitConfirmBtn.disabled = !(
                submitContent && submitContent.value.trim()
                && submitCategory && submitCategory.value
            );
        }

        function openSubmitModal() {
            if (!submitModal) return;
            modalLastFocused = document.activeElement;
            submitModal.classList.add('is-open');
            submitModal.setAttribute('aria-hidden', 'false');
            if (!submitCategoriesLoaded) {
                loadSubmitCategories();
            }
            /* 触屏小屏不自动聚焦，避免输入法弹出遮挡 */
            var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (!(isTouch && window.innerWidth < 768)) {
                setTimeout(function () {
                    if (submitContent) submitContent.focus();
                }, 300);
            }
        }

        function closeSubmitModal() {
            if (!submitModal) return;
            submitModal.classList.remove('is-open');
            submitModal.setAttribute('aria-hidden', 'true');
            if (submitForm) submitForm.reset();
            if (submitContentCount) submitContentCount.textContent = '0';
            if (submitContentCount) {
                submitContentCount.classList.remove('is-warn');
            }
            if (submitConfirmBtn) submitConfirmBtn.disabled = true;
            if (modalLastFocused && typeof modalLastFocused.focus === 'function') {
                modalLastFocused.focus();
                modalLastFocused = null;
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            if (submitting) return;
            var content = submitContent ? submitContent.value.trim() : '';
            var categoryName = submitCategory ? submitCategory.value : '';
            if (!content) {
                showToast('请输入句子内容');
                return;
            }
            if (!categoryName) {
                showToast('请选择分类');
                return;
            }
            submitting = true;
            submitConfirmBtn.disabled = true;
            submitConfirmBtn.textContent = '投递中...';
            try {
                var body = {
                    content: content,
                    categoryName: categoryName,
                    author: document.getElementById('submitAuthor').value.trim() || undefined,
                    source: document.getElementById('submitSource').value.trim() || undefined,
                    submitterName: document.getElementById('submitterName').value.trim() || undefined
                };
                var res = await fetch(SUBMIT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                var data = await res.json().catch(function () { return {}; });
                if (res.ok && data.success) {
                    showToast(data.message || '投递成功，等待审核');
                    closeSubmitModal();
                } else if (res.status === 429) {
                    showToast(data.message || '提交过于频繁，请稍后再试');
                } else if (res.status === 403) {
                    showToast(data.message || '访客提交功能未开启');
                } else {
                    showToast(data.message || '提交失败，请稍后再试');
                }
            } catch (e) {
                showToast('网络异常，请稍后再试');
            } finally {
                submitting = false;
                submitConfirmBtn.textContent = '投递';
                validateSubmitForm();
            }
        }

        /* ==================== 初始化 ==================== */
        document.addEventListener('DOMContentLoaded', function () {
            grid = document.getElementById('sentenceGrid');
            emptyState = document.getElementById('gridEmpty');
            refreshBtn = document.getElementById('refreshBtn');
            tabsEl = document.getElementById('categoryTabs');
            submitModal = document.getElementById('submitModal');
            submitForm = document.getElementById('submitForm');
            submitContent = document.getElementById('submitContent');
            submitContentCount = document.getElementById('submitContentCount');
            submitCategory = document.getElementById('submitCategory');
            submitConfirmBtn = document.getElementById('submitConfirm');
            submitBtn = document.getElementById('submitBtn');

            /* SSR 卡片（含分享聚光卡片）：格式化计数并按本地记录补齐点赞态 */
            var cards = document.querySelectorAll('[data-name]');
            cards.forEach(function (card) {
                var name = card.getAttribute('data-name');
                var likeBtn = card.querySelector('.card-like');
                if (likeBtn) {
                    var countEl = likeBtn.querySelector('.card-like__count');
                    if (countEl) {
                        countEl.textContent =
                            formatCount(countEl.getAttribute('data-likes'));
                    }
                    if (name && isLiked(name)) {
                        likeBtn.classList.add('is-liked');
                        likeBtn.setAttribute('aria-label', '已点赞，点击取消');
                    }
                }
            });

            /* SSR 网格为空时直接展示空态 */
            if (grid && grid.children.length === 0) {
                showEmpty();
            }

            /* 恢复上次选择的分类；SSR 内容为默认分类，若访客存有其他分类则重新拉取 */
            var stored = getStoredCategory();
            var storedTab = null;
            if (stored && tabsEl) {
                var tabs = tabsEl.querySelectorAll('.glass-tab');
                for (var i = 0; i < tabs.length; i++) {
                    if ((tabs[i].getAttribute('data-cat') || '') === stored) {
                        storedTab = tabs[i];
                        break;
                    }
                }
            }
            if (stored && storedTab) {
                currentCategory = stored;
                markActiveTab(stored);
                loadSentences();
            } else {
                if (stored) setStoredCategory(''); /* 分类已不存在，回退默认 */
                markActiveTab('');
            }

            /* 换一批 */
            if (refreshBtn) {
                refreshBtn.addEventListener('click', loadSentences);
            }

            /* 分类标签点击（分类导航与内容联动） */
            if (tabsEl) {
                tabsEl.addEventListener('click', function (e) {
                    var tab = e.target.closest ? e.target.closest('.glass-tab') : null;
                    if (!tab) return;
                    var cat = tab.getAttribute('data-cat') || '';
                    if (cat === currentCategory) return;
                    selectCategory(cat);
                });
            }

            /* 点赞 / 复制分享链接（事件委托） */
            document.addEventListener('click', function (e) {
                if (!e.target || !e.target.closest) return;
                var likeBtn = e.target.closest('.card-like');
                if (likeBtn) {
                    handleLike(likeBtn);
                    return;
                }
                var copyBtn = e.target.closest('.card-copy');
                if (copyBtn) {
                    handleCopy(copyBtn);
                }
            });

            /* 投递弹窗 */
            if (submitBtn) submitBtn.addEventListener('click', openSubmitModal);
            var closeBtn = document.getElementById('submitModalClose');
            if (closeBtn) closeBtn.addEventListener('click', closeSubmitModal);
            var backdrop = document.getElementById('submitModalBackdrop');
            if (backdrop) backdrop.addEventListener('click', closeSubmitModal);
            var cancelBtn = document.getElementById('submitCancel');
            if (cancelBtn) cancelBtn.addEventListener('click', closeSubmitModal);
            if (submitForm) submitForm.addEventListener('submit', handleSubmit);
            if (submitContent) {
                submitContent.addEventListener('input', function () {
                    submitContentCount.textContent =
                        String(submitContent.value.length);
                    submitContentCount.classList.toggle('is-warn',
                        submitContent.value.length >= 450);
                    validateSubmitForm();
                });
            }
            if (submitCategory) {
                submitCategory.addEventListener('change', validateSubmitForm);
            }

            /* Escape 关闭弹窗，弹窗内 Tab 循环聚焦 */
            document.addEventListener('keydown', function (e) {
                if (!submitModal || !submitModal.classList.contains('is-open')) {
                    return;
                }
                if (e.key === 'Escape') {
                    closeSubmitModal();
                } else if (e.key === 'Tab') {
                    var focusables = submitModal.querySelectorAll(
                        'button, input, textarea, select, [href]');
                    if (focusables.length === 0) return;
                    var first = focusables[0];
                    var last = focusables[focusables.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            });

            /* 查询访客提交配置，未启用则隐藏投递入口 */
            loadSubmissionConfig();
        });
    })();
</script>
</th:block>
