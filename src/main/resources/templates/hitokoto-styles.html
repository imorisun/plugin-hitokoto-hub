<!--
  访客模板样式 fragment（从 hitokoto.html 拆分，零行为变更）。
  通过 <th:block th:replace="~{hitokoto-styles :: styles}"/> 引用。
-->
<th:block th:fragment="styles" xmlns:th="http://www.thymeleaf.org">
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* 暗色主题（默认） */
            --bg: #0a0606;
            --bg-glass: rgba(20, 12, 12, 0.5);
            --bg-glass-hover: rgba(251, 113, 133, 0.1);
            --bg-glass-toast: rgba(20, 12, 12, 0.82);
            --bg-card: rgba(15, 9, 9, 0.92);
            --bg-input: rgba(0, 0, 0, 0.25);
            --bg-input-focus: rgba(251, 113, 133, 0.04);
            --bg-dropdown: rgba(20, 12, 12, 0.97);
            --bg-select-option: #1a1010;
            --bg-next-line: #2b2b2b;
            --accent: #fb7185;
            --accent-soft: #f472b6;
            --accent-glow: rgba(251, 113, 133, 0.35);
            --text: #e7e5e4;
            --text-dim: #a1a1aa;
            --muted: #52525b;
            --line: rgba(251, 113, 133, 0.35);
            --border-default: rgba(251, 113, 133, 0.14);
            --border-hover: rgba(251, 113, 133, 0.32);
            --border-focus: rgba(251, 113, 133, 0.5);
            --border-card: rgba(251, 113, 133, 0.22);
            --border-toast: rgba(251, 113, 133, 0.18);
            --border-dropdown: rgba(251, 113, 133, 0.18);
            --border-input: rgba(251, 113, 133, 0.16);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(251, 113, 133, 0.05);
            --shadow-text: 0 2px 24px rgba(0, 0, 0, 0.4);
            --vignette-bg: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
            --glow-primary: radial-gradient(ellipse at center, rgba(251, 113, 133, 0.07) 0%, transparent 70%);
            --glow-secondary: radial-gradient(ellipse at center, rgba(244, 114, 182, 0.05) 0%, transparent 70%);
            --petal-bg: linear-gradient(135deg, rgba(251, 113, 133, 0.7) 0%, rgba(244, 114, 182, 0.5) 100%);
            --scrollbar-track: rgba(0, 0, 0, 0.2);
            --scrollbar-thumb: rgba(251, 113, 133, 0.25);
            --scrollbar-thumb-hover: rgba(251, 113, 133, 0.45);
            --scrollbar-track-dropdown: transparent;
            --color-scheme: dark;
            --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            /* 层级变量：toast(500) > dropdown(400) > modal(300)，确保 Toast 始终可见 */
            --z-modal: 300;
            --z-dropdown: 400;
            --z-toast: 500;
        }

        /* 亮色主题 */
        [data-theme="light"] {
            --bg: #faf7f5;
            --bg-glass: rgba(255, 250, 248, 0.6);
            --bg-glass-hover: rgba(251, 113, 133, 0.08);
            --bg-glass-toast: rgba(255, 250, 248, 0.88);
            --bg-card: rgba(255, 252, 250, 0.92);
            --bg-input: rgba(0, 0, 0, 0.04);
            --bg-input-focus: rgba(251, 113, 133, 0.04);
            --bg-dropdown: rgba(255, 252, 250, 0.97);
            --bg-select-option: #fff5f5;
            --bg-next-line: #d6d3d1;
            --accent: #e85d6f;
            --accent-soft: #e8639e;
            --accent-glow: rgba(232, 93, 111, 0.25);
            --text: #1c1917;
            --text-dim: #78716c;
            --muted: #a8a29e;
            --line: rgba(232, 93, 111, 0.25);
            --border-default: rgba(232, 93, 111, 0.18);
            --border-hover: rgba(232, 93, 111, 0.38);
            --border-focus: rgba(232, 93, 111, 0.55);
            --border-card: rgba(232, 93, 111, 0.2);
            --border-toast: rgba(232, 93, 111, 0.15);
            --border-dropdown: rgba(232, 93, 111, 0.15);
            --border-input: rgba(232, 93, 111, 0.18);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(232, 93, 111, 0.04);
            --shadow-text: 0 2px 16px rgba(0, 0, 0, 0.05);
            --vignette-bg: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.08) 100%);
            --glow-primary: radial-gradient(ellipse at center, rgba(232, 93, 111, 0.06) 0%, transparent 70%);
            --glow-secondary: radial-gradient(ellipse at center, rgba(232, 99, 158, 0.04) 0%, transparent 70%);
            --petal-bg: linear-gradient(135deg, rgba(232, 93, 111, 0.5) 0%, rgba(232, 99, 158, 0.35) 100%);
            --scrollbar-track: rgba(0, 0, 0, 0.06);
            --scrollbar-thumb: rgba(232, 93, 111, 0.2);
            --scrollbar-thumb-hover: rgba(232, 93, 111, 0.35);
            --scrollbar-track-dropdown: transparent;
            --color-scheme: light;
        }

        @keyframes charFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(2px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes textShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes authorFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
                filter: blur(1px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.35); }
            50% { transform: scale(0.92); }
            75% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(12px);
            }
        }

        @keyframes nextPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes glowBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
        }

        @keyframes countPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, BlinkMacSystemFont, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        input, textarea { user-select: text; }

        /* 多层背景光晕，营造空间深度 */
        .bg-glow {
            position: fixed;
            top: 62%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            height: 1200px;
            background: var(--glow-primary);
            pointer-events: none;
            z-index: 0;
            transition: background 0.4s ease;
            animation: glowBreathe 8s ease-in-out infinite;
        }

        .bg-glow.top {
            top: 18%;
            left: 28%;
            width: 700px;
            height: 700px;
            background: var(--glow-secondary);
            animation: glowBreathe 10s ease-in-out 2s infinite;
        }

        /* 边缘暗角，聚焦中心 */
        .vignette {
            position: fixed;
            inset: 0;
            background: var(--vignette-bg);
            pointer-events: none;
            z-index: 1;
            transition: background 0.4s ease;
        }

        /* 噪点纹理：模拟胶片质感 */
        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            filter: url(#noise-filter);
            opacity: 0.035;
        }

        .sakura {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            will-change: transform, opacity;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .sakura span {
            display: block;
            background: var(--petal-bg);
            border-radius: 50% 0 50% 50%;
            box-shadow: 0 0 6px rgba(251, 113, 133, 0.2);
            transition: background 0.4s ease;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-btn {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.3s;
            font-family: var(--ui-font);
            opacity: 0;
            animation: authorFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 0.6s;
        }

        .music-btn:hover {
            color: var(--accent);
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.25rem;
            position: relative;
            z-index: 20;
        }

        .quote-container {
            text-align: center;
            max-width: 48rem;
            width: 100%;
        }

        .quote-text {
            font-size: 1rem;
            line-height: 2;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--text);
            overflow-wrap: break-word;
            word-break: break-word;
            transition: opacity 0.3s ease, color 0.4s ease, text-shadow 0.3s ease;
            cursor: default;
            text-shadow: var(--shadow-text);
            display: inline;
        }

        /* 流光渐变：逐字动画完成后渐显 */
        .quote-text.shimmer {
            background: linear-gradient(
                105deg,
                transparent 35%,
                rgba(251, 113, 133, 0.06) 42%,
                rgba(251, 113, 133, 0.12) 45%,
                rgba(244, 114, 182, 0.1) 48%,
                rgba(251, 113, 133, 0.06) 55%,
                transparent 62%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShimmer 4s ease-in-out infinite;
        }

        :root[data-theme="light"] .quote-text.shimmer {
            background: linear-gradient(
                105deg,
                transparent 35%,
                rgba(232, 93, 111, 0.08) 42%,
                rgba(232, 93, 111, 0.15) 45%,
                rgba(232, 99, 158, 0.12) 48%,
                rgba(232, 93, 111, 0.08) 55%,
                transparent 62%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShimmer 4s ease-in-out infinite;
        }

        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charFadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .quote-author {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            font-family: var(--ui-font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            transition: opacity 0.3s ease;
        }

        .quote-author::before,
        .quote-author::after {
            content: '';
            width: 1.8rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
            opacity: 0;
        }

        /* 可点击句子（带跳转链接）—— 仅鼠标悬停在句子文字上时才触发 */
        .quote-container--clickable .quote-text {
            cursor: pointer;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .quote-container--clickable .quote-text:hover {
            color: var(--accent);
            text-shadow: 0 0 24px var(--accent-glow);
        }

        /* 右上角点赞按钮 */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-default);
            cursor: pointer;
            color: var(--text-dim);
            font-family: var(--ui-font);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            transition: color 0.3s, background-color 0.3s, border-color 0.3s, transform 0.2s;
            opacity: 0;
            animation: authorFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1s;
        }

        .like-btn:hover {
            color: var(--accent);
            background-color: var(--bg-glass-hover);
            border-color: var(--border-hover);
        }

        .like-btn:active {
            transform: scale(0.94);
        }

        .like-btn .heart-icon {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.3s, stroke 0.3s, color 0.3s, filter 0.3s;
        }

        .like-btn.liked {
            color: var(--accent);
            border-color: rgba(251, 113, 133, 0.38);
            background-color: rgba(251, 113, 133, 0.08);
        }

        .like-btn.liked .heart-icon {
            fill: var(--accent);
            stroke: var(--accent);
            filter: drop-shadow(0 0 8px var(--accent-glow));
            animation: heartBeat 0.6s ease;
        }

        .like-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .like-btn:disabled:hover {
            color: var(--text-dim);
            background: var(--bg-glass);
            border-color: var(--border-default);
        }

        .like-count {
            min-width: 1.5em;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .like-count.pop {
            animation: countPop 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        footer {
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .next-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.3s, opacity 0.3s;
            background: none;
            border: none;
            font-family: var(--ui-font);
            opacity: 0;
            animation: authorFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1s;
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .next-btn:disabled:hover {
            color: var(--muted);
        }

        .next-btn--loading .line::after {
            transform: translateY(0);
            animation: nextPulse 0.8s ease-in-out infinite;
        }

        .next-btn--loading {
            animation: nextPulse 0.8s ease-in-out infinite;
            animation-delay: 0s;
        }

        .next-btn .line {
            width: 1px;
            height: 1.5rem;
            background-color: var(--bg-next-line);
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s, background-color 0.4s;
        }

        .next-btn .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            transform: translateY(-100%);
            transition: transform 0.5s ease;
        }

        .next-btn:hover {
            color: var(--accent);
        }

        .next-btn:hover .line {
            background-color: rgba(251, 113, 133, 0.4);
        }

        .next-btn:hover .line::after {
            transform: translateY(0);
        }

        /* 轻提示 */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-glass-toast);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-toast);
            color: var(--text);
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            opacity: 0;
            pointer-events: none;
            z-index: var(--z-toast);
            font-family: var(--ui-font);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        .toast.show {
            animation: toastIn 0.35s ease forwards;
        }

        .toast.hide {
            animation: toastOut 0.3s ease forwards;
        }

        ::selection {
            background-color: rgba(251, 113, 133, 0.3);
            color: var(--text);
        }

        /* 平板 */
        @media (min-width: 640px) {
            header {
                padding: 1.5rem 2rem;
            }

            main {
                padding: 0 1.5rem;
            }

            .music-btn {
                font-size: 0.75rem;
                letter-spacing: 0.32em;
            }

            .quote-text {
                font-size: 1.15rem;
                line-height: 2.1;
            }

            .quote-author {
                margin-top: 1.8rem;
                font-size: 0.68rem;
                letter-spacing: 0.13em;
            }

            .quote-author::before, .quote-author::after {
                width: 2.2rem;
            }

            .like-btn {
                font-size: 0.72rem;
                gap: 0.45rem;
            }

            .like-btn .heart-icon {
                width: 16px;
                height: 16px;
            }

            .theme-toggle {
                width: 34px;
                height: 34px;
            }

            .theme-toggle svg {
                width: 17px;
                height: 17px;
            }

            .submit-btn {
                font-size: 0.72rem;
                gap: 0.45rem;
            }

            .submit-btn svg {
                width: 15px;
                height: 15px;
            }

            footer {
                bottom: 1.5rem;
            }

            .next-btn {
                font-size: 0.65rem;
                gap: 0.6rem;
            }

            .next-btn .line {
                height: 1.8rem;
            }
        }

        /* 桌面 */
        @media (min-width: 768px) {
            header {
                padding: 2rem 2.5rem;
            }

            main {
                padding: 0 2rem;
            }

            .music-btn {
                font-size: 0.85rem;
                letter-spacing: 0.35em;
            }

            .quote-text {
                font-size: 1.875rem;
                line-height: 2.4;
            }

            .quote-author {
                margin-top: 2.5rem;
                font-size: 0.75rem;
                letter-spacing: 0.15em;
                gap: 0.8rem;
            }

            .quote-author::before, .quote-author::after {
                width: 2.5rem;
            }

            .like-btn {
                font-size: 0.76rem;
                gap: 0.5rem;
                padding: 0.45rem 1rem;
            }

            .like-btn .heart-icon {
                width: 17px;
                height: 17px;
            }

            .theme-toggle {
                width: 36px;
                height: 36px;
            }

            .theme-toggle svg {
                width: 18px;
                height: 18px;
            }

            .submit-btn {
                font-size: 0.76rem;
                gap: 0.5rem;
                padding: 0.45rem 1rem;
            }

            .submit-btn svg {
                width: 16px;
                height: 16px;
            }

            footer {
                bottom: 2rem;
            }

            .next-btn {
                font-size: 0.7rem;
                letter-spacing: 0.35em;
                gap: 0.75rem;
            }

            .next-btn .line {
                height: 2rem;
            }
        }

        @media (min-width: 1024px) {
            .quote-text {
                font-size: 2.65rem;
                line-height: 2.5;
            }
        }

        /* ==================== 访客提交按钮 ==================== */
        .submit-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-default);
            cursor: pointer;
            color: var(--text-dim);
            font-family: var(--ui-font);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            transition: color 0.3s, background-color 0.3s, border-color 0.3s, transform 0.2s;
            opacity: 0;
            animation: authorFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1s;
        }

        .submit-btn:hover {
            color: var(--accent);
            background-color: var(--bg-glass-hover);
            border-color: var(--border-hover);
        }

        .submit-btn:active {
            transform: scale(0.94);
        }

        .submit-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        @keyframes fieldSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 提交弹窗 ==================== */
        .submit-modal {
            position: fixed;
            inset: 0;
            z-index: var(--z-modal);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .submit-modal.open,
        .submit-modal.closing {
            display: flex;
        }

        .submit-modal__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .submit-modal.open .submit-modal__backdrop {
            opacity: 1;
        }

        .submit-modal__card {
            position: relative;
            width: 100%;
            max-width: 30rem;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
