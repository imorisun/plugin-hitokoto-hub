<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>轻言-轻拾人间辞藻，言说万千心绪</title>
    <!-- Favicon 玫瑰色花瓣 -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fb7185' d='M50 15 C70 25 85 45 75 65 C65 85 35 85 25 65 C15 45 30 25 50 15 Z' transform='rotate(45 50 50)'/%3E%3C/svg%3E"/>
    <link rel="apple-touch-icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fb7185' d='M50 15 C70 25 85 45 75 65 C65 85 35 85 25 65 C15 45 30 25 50 15 Z' transform='rotate(45 50 50)'/%3E%3C/svg%3E"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0606;
            --accent: #fb7185;
            --accent-soft: #f472b6;
            --accent-glow: rgba(251, 113, 133, 0.35);
            --text: #e7e5e4;
            --text-dim: #a1a1aa;
            --muted: #52525b;
            --line: rgba(251, 113, 133, 0.35);
            --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        @keyframes charFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(2px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes authorFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
                filter: blur(1px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.35); }
            50% { transform: scale(0.92); }
            75% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes heartBurst {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
            }
            60% { opacity: 1; }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot));
                opacity: 0;
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, BlinkMacSystemFont, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 多层背景光晕，营造空间深度 */
        .bg-glow {
            position: fixed;
            top: 62%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            height: 1200px;
            background: radial-gradient(ellipse at center, rgba(251, 113, 133, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow.top {
            top: 18%;
            left: 28%;
            width: 700px;
            height: 700px;
            background: radial-gradient(ellipse at center, rgba(244, 114, 182, 0.05) 0%, transparent 70%);
        }

        /* 边缘暗角，聚焦中心 */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .sakura {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            will-change: transform;
        }

        .sakura span {
            display: block;
            background: linear-gradient(135deg, rgba(251, 113, 133, 0.7) 0%, rgba(244, 114, 182, 0.5) 100%);
            border-radius: 50% 0 50% 50%;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-btn {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.3s;
            font-family: var(--ui-font);
        }

        .music-btn:hover {
            color: var(--accent);
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.25rem;
            position: relative;
            z-index: 20;
        }

        .quote-container {
            text-align: center;
            max-width: 48rem;
            width: 100%;
        }

        .quote-text {
            font-size: 1rem;
            line-height: 2;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--text);
            -webkit-line-clamp: 6;
            overflow: hidden;
            transition: opacity 0.3s ease;
            cursor: pointer;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.4);
        }

        .quote-text .char {
            display: inline-block;
            opacity: 0;
            animation: charFadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .quote-author {
            margin-top: 1.5rem;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            font-family: var(--ui-font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
            transition: opacity 0.3s ease;
        }

        .quote-author::before,
        .quote-author::after {
            content: '';
            width: 1.8rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line), transparent);
            opacity: 0;
        }

        /* 右上角点赞按钮 */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(20, 12, 12, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(251, 113, 133, 0.14);
            cursor: pointer;
            color: var(--text-dim);
            font-family: var(--ui-font);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            transition: color 0.3s, background-color 0.3s, border-color 0.3s, transform 0.2s;
            opacity: 0;
            animation: authorFadeIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            animation-delay: 1s;
        }

        .like-btn:hover {
            color: var(--accent);
            background-color: rgba(251, 113, 133, 0.1);
            border-color: rgba(251, 113, 133, 0.32);
        }

        .like-btn:active {
            transform: scale(0.94);
        }

        .like-btn .heart-icon {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: fill 0.3s, stroke 0.3s, color 0.3s, filter 0.3s;
        }

        .like-btn.liked {
            color: var(--accent);
            border-color: rgba(251, 113, 133, 0.38);
            background-color: rgba(251, 113, 133, 0.08);
        }

        .like-btn.liked .heart-icon {
            fill: var(--accent);
            stroke: var(--accent);
            filter: drop-shadow(0 0 8px var(--accent-glow));
            animation: heartBeat 0.6s ease;
        }

        .like-count {
            min-width: 1.5em;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        footer {
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }

        .next-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.3s;
            background: none;
            border: none;
            font-family: var(--ui-font);
        }

        .next-btn .line {
            width: 1px;
            height: 1.5rem;
            background-color: #2b2b2b;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .next-btn .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            transform: translateY(-100%);
            transition: transform 0.5s ease;
        }

        .next-btn:hover {
            color: var(--accent);
        }

        .next-btn:hover .line {
            background-color: rgba(251, 113, 133, 0.4);
        }

        .next-btn:hover .line::after {
            transform: translateY(0);
        }

        /* 双击点赞飞出的心形粒子 */
        .heart-particle {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            color: var(--accent);
            font-size: 14px;
            animation: heartBurst 0.9s ease-out forwards;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        /* 轻提示 */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 12, 12, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 113, 133, 0.18);
            color: var(--text);
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            font-family: var(--ui-font);
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            animation: toastIn 0.35s ease forwards;
        }

        ::selection {
            background-color: rgba(251, 113, 133, 0.3);
        }

        /* 平板 */
        @media (min-width: 640px) {
            header {
                padding: 1.5rem 2rem;
            }

            main {
                padding: 0 1.5rem;
            }

            .music-btn {
                font-size: 0.75rem;
                letter-spacing: 0.32em;
            }

            .quote-text {
                font-size: 1.15rem;
                line-height: 2.1;
                -webkit-line-clamp: 5;
            }

            .quote-author {
                margin-top: 1.8rem;
                font-size: 0.68rem;
                letter-spacing: 0.13em;
            }

            .quote-author::before, .quote-author::after {
                width: 2.2rem;
            }

            .like-btn {
                font-size: 0.72rem;
                gap: 0.45rem;
            }

            .like-btn .heart-icon {
                width: 16px;
                height: 16px;
            }

            footer {
                bottom: 1.5rem;
            }

            .next-btn {
                font-size: 0.65rem;
                gap: 0.6rem;
            }

            .next-btn .line {
                height: 1.8rem;
            }
        }

        /* 桌面 */
        @media (min-width: 768px) {
            header {
                padding: 2rem 2.5rem;
            }

            main {
                padding: 0 2rem;
            }

            .music-btn {
                font-size: 0.85rem;
                letter-spacing: 0.35em;
            }

            .quote-text {
                font-size: 1.875rem;
                line-height: 2.4;
            }

            .quote-author {
                margin-top: 2.5rem;
                font-size: 0.75rem;
                letter-spacing: 0.15em;
                gap: 0.8rem;
            }

            .quote-author::before, .quote-author::after {
                width: 2.5rem;
            }

            .like-btn {
                font-size: 0.76rem;
                gap: 0.5rem;
                padding: 0.45rem 1rem;
            }

            .like-btn .heart-icon {
                width: 17px;
                height: 17px;
            }

            footer {
                bottom: 2rem;
            }

            .next-btn {
                font-size: 0.7rem;
                letter-spacing: 0.35em;
                gap: 0.75rem;
            }

            .next-btn .line {
                height: 2rem;
            }

            .heart-particle {
                font-size: 16px;
            }
        }

        @media (min-width: 1024px) {
            .quote-text {
                font-size: 2.65rem;
                line-height: 2.5;
            }
        }
    </style>
</head>
<body>
<div class="bg-glow top"></div>
<div class="bg-glow"></div>
<div class="vignette"></div>
<div id="sakura-container"></div>

<header>
    <div class="music-btn">LiteWords</div>
    <button class="like-btn" id="likeBtn" type="button" aria-label="点赞">
        <svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="like-count" id="likeCount">0</span>
    </button>
</header>

<main>
    <div class="quote-container" id="quoteContainer"
         th:each="s : ${hitokotoFinder.randomSentences(1, null)}"
         th:attr="data-name=${s.name}, data-likes=${s.likeCount}">
        <h1 class="quote-text" id="quoteText" th:text="${s.content}">加载中...</h1>
        <p class="quote-author" id="quoteAuthor"
           th:attr="data-author=${s.author}, data-source=${s.source}"
           th:text="${s.author} ? ${s.author} + (${s.source} ? ' · 《' + ${s.source} + '》' : '') : '佚名'">
        </p>
    </div>
</main>

<footer>
    <button class="next-btn" id="nextBtn" type="button">
        Next
        <span class="line"></span>
    </button>
</footer>

<div class="toast" id="toast"></div>

<script>
    /* ==================== 句子状态 ==================== */
    const state = {
        name: '',
        likes: 0,
        liked: false,
        busy: false
    };

    const LIKE_API = '/apis/public.api.hitokotohub.puresky.top/v1alpha1/sentence/like';
    const RANDOM_API = '/apis/public.api.hitokotohub.puresky.top/v1alpha1/sentence/random?limit=1';

    /* ==================== 文字入场动画 ==================== */
    function animateText(elementId) {
        const element = document.getElementById(elementId);
        const text = element.innerText.trim();
        element.innerHTML = '';
        let delay = 0;
        const charDelay = 0.035;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.animationDelay = `${delay}s`;
            element.appendChild(span);
            delay += charDelay;
        }
    }

    function animateAuthor(callback) {
        const el = document.getElementById('quoteAuthor');
        const text = el.innerText.trim();
        el.innerHTML = '';
        el.style.opacity = '1';
        let delay = 0;
        const authorCharDelay = 0.05;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.cssText = `
                display: inline-block;
                opacity: 0;
                animation: authorFadeIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
                animation-delay: ${delay}s;
            `;
            el.appendChild(span);
            delay += authorCharDelay;
        }
        const lineDelay = delay - authorCharDelay + 0.4;
        const styleSheet = document.createElement('style');
        styleSheet.id = 'dynamic-line-delay';
        styleSheet.textContent = `
            #quoteAuthor::before,
            #quoteAuthor::after {
                animation: authorFadeIn 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
                animation-delay: ${lineDelay}s;
            }
        `;
        const oldStyle = document.getElementById('dynamic-line-delay');
        if (oldStyle) oldStyle.remove();
        document.head.appendChild(styleSheet);
        const totalDuration = (lineDelay + 0.7) * 1000;
        if (callback) setTimeout(callback, totalDuration);
    }

    /* ==================== 点赞状态读写 ==================== */
    function likedKey(name) {
        return 'hitokoto:liked:' + name;
    }

    function isLiked(name) {
        try {
            return localStorage.getItem(likedKey(name)) === '1';
        } catch (e) {
            return false;
        }
    }

    function setLiked(name, liked) {
        try {
            if (liked) {
                localStorage.setItem(likedKey(name), '1');
            } else {
                localStorage.removeItem(likedKey(name));
            }
        } catch (e) {
            /* localStorage 不可用时静默处理 */
        }
    }

    function formatCount(n) {
        if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
        return String(n);
    }

    /* ==================== 渲染点赞 UI ==================== */
    function renderLikeUI() {
        const btn = document.getElementById('likeBtn');
        const countEl = document.getElementById('likeCount');
        countEl.textContent = formatCount(state.likes);
        btn.classList.toggle('liked', state.liked);
    }

    function loadFromDOM() {
        const container = document.getElementById('quoteContainer');
        state.name = container.getAttribute('data-name') || '';
        state.likes = parseInt(container.getAttribute('data-likes') || '0', 10) || 0;
        state.liked = isLiked(state.name);
        renderLikeUI();
    }

    /* ==================== 心形粒子动画 ==================== */
    function createHeartBurst(x, y) {
        const count = 7;
        for (let i = 0; i < count; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.textContent = '\u2665';
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
            const distance = 55 + Math.random() * 50;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;
            const rot = (Math.random() - 0.5) * 60;
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.setProperty('--dx', dx + 'px');
            heart.style.setProperty('--dy', dy + 'px');
            heart.style.setProperty('--rot', rot + 'deg');
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 900);
        }
    }

    /* ==================== 轻提示 ==================== */
    let toastTimer = null;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.remove('show');
        void toast.offsetWidth; /* 重置动画 */
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
            toast.style.opacity = '0';
        }, 2200);
    }

    /* ==================== 点赞切换 ==================== */
    async function toggleLike(originX, originY) {
        if (state.busy || !state.name) return;
        state.busy = true;
        const action = state.liked ? 'unlike' : 'like';
        const btn = document.getElementById('likeBtn');
        btn.disabled = true;
        try {
            const url = LIKE_API + '?name=' + encodeURIComponent(state.name) + '&action=' + action;
            const res = await fetch(url);
            const data = await res.json();
            if (data.success) {
                state.liked = !state.liked;
                setLiked(state.name, state.liked);
                if (data.sentence && typeof data.sentence.likeCount === 'number') {
                    state.likes = data.sentence.likeCount;
                } else {
                    state.likes += state.liked ? 1 : -1;
                    if (state.likes < 0) state.likes = 0;
                }
                renderLikeUI();
                /* 触发心跳动画 */
                btn.classList.remove('liked');
                void btn.offsetWidth;
                btn.classList.toggle('liked', state.liked);
                if (state.liked && originX != null && originY != null) {
                    createHeartBurst(originX, originY);
                }
            } else {
                showToast(data.message || '操作过于频繁');
            }
        } catch (e) {
            showToast('网络异常，请稍后再试');
        } finally {
            state.busy = false;
            btn.disabled = false;
        }
    }

    /* ==================== 应用新句子 ==================== */
    function applySentence(s) {
        const textEl = document.getElementById('quoteText');
        const authorEl = document.getElementById('quoteAuthor');
        const container = document.getElementById('quoteContainer');
        const oldStyle = document.getElementById('dynamic-line-delay');
        if (oldStyle) oldStyle.remove();

        textEl.style.opacity = '0';
        authorEl.style.opacity = '0';

        setTimeout(() => {
            textEl.innerText = s.content || '';
            const author = s.author || '';
            const source = s.source || '';
            authorEl.setAttribute('data-author', author);
            authorEl.setAttribute('data-source', source);
            authorEl.innerText = author
                ? author + (source ? ' · 《' + source + '》' : '')
                : '佚名';

            state.name = s.metaName || s.name || '';
            state.likes = s.likeCount || 0;
            state.liked = isLiked(state.name);
            container.setAttribute('data-name', state.name);
            container.setAttribute('data-likes', state.likes);
            renderLikeUI();

            textEl.style.opacity = '1';
            animateText('quoteText');
            animateAuthor();
        }, 300);
    }

    async function fetchNewSentence() {
        const res = await fetch(RANDOM_API);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        const list = data.sentences || [];
        if (list.length === 0) throw new Error('empty');
        return list[0];
    }

    /* ==================== 初始化 ==================== */
    document.addEventListener('DOMContentLoaded', () => {
        animateText('quoteText');
        animateAuthor();
        loadFromDOM();
        /* 首次进入提示一次双击点赞 */
        if (!sessionStorage.getItem('hitokoto:hint-shown')) {
            setTimeout(() => {
                showToast('双击屏幕任意位置点赞');
                try { sessionStorage.setItem('hitokoto:hint-shown', '1'); } catch (e) {}
            }, 1200);
        }
    });

    /* ==================== 交互绑定 ==================== */
    /* 双击屏幕任意位置点赞 / 取消点赞 */
    document.addEventListener('dblclick', (e) => {
        /* 忽略交互按钮上的双击，避免与单击冲突 */
        if (e.target.closest('.like-btn, .next-btn, .music-btn')) return;
        const sel = window.getSelection && window.getSelection();
        if (sel && sel.removeAllRanges) sel.removeAllRanges();
        toggleLike(e.clientX, e.clientY);
    });

    /* 心形按钮单击点赞 / 取消点赞 */
    document.getElementById('likeBtn').addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        toggleLike(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    /* 下一句 */
    document.getElementById('nextBtn').addEventListener('click', async () => {
        const btn = document.getElementById('nextBtn');
        btn.disabled = true;
        try {
            const s = await fetchNewSentence();
            applySentence(s);
        } catch (e) {
            console.error('刷新失败', e);
            showToast('刷新失败，请稍后再试');
        } finally {
            btn.disabled = false;
        }
    });

    /* ==================== 樱花动画 ==================== */
    const sakuraList = [];
    const container = document.getElementById('sakura-container');
    let mouseX = -1000, mouseY = -1000;
    document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    document.addEventListener('touchmove', e => {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    });

    function createSakura() {
        const sakura = document.createElement('div');
        sakura.className = 'sakura';
        const petal = document.createElement('span');
        sakura.appendChild(petal);
        const size = Math.random() * 6 + 8;
        petal.style.width = size + 'px';
        petal.style.height = size + 'px';
        const x = Math.random() * window.innerWidth;
        const y = -30;
        const speed = Math.random() * 0.8 + 0.4;
        const wobbleSpeed = Math.random() * 0.02 + 0.01;
        const wobbleAmount = Math.random() * 40 + 20;
        const rotationSpeed = (Math.random() - 0.5) * 2;
        const sakuraData = {
            element: sakura, x, y, baseX: x, speed, wobbleSpeed, wobbleAmount,
            rotation: Math.random() * 360, rotationSpeed,
            time: Math.random() * Math.PI * 2, size, vx: 0, vy: 0,
            opacity: Math.random() * 0.4 + 0.4
        };
        petal.style.opacity = sakuraData.opacity;
        sakura.style.transform = `translate(${x}px, ${y}px) rotate(${sakuraData.rotation}deg)`;
        container.appendChild(sakura);
        sakuraList.push(sakuraData);
    }

    function animateSakura() {
        for (let i = sakuraList.length - 1; i >= 0; i--) {
            const s = sakuraList[i];
            const dx = s.x - mouseX, dy = s.y - mouseY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 100) {
                const force = (100 - distance) / 100;
                const angle = Math.atan2(dy, dx);
                s.vx += Math.cos(angle) * force * 3;
                s.vy += Math.sin(angle) * force * 2;
                s.rotation += force * 10;
            }
            s.vx *= 0.98;
            s.vy *= 0.98;
            s.time += s.wobbleSpeed;
            s.y += s.speed;
            s.x = s.baseX + Math.sin(s.time) * s.wobbleAmount;
            s.x += s.vx;
            s.y += s.vy;
            s.rotation += s.rotationSpeed;
            s.element.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rotation}deg)`;
            if (s.y > window.innerHeight + 50) {
                s.element.remove();
                sakuraList.splice(i, 1);
            }
        }
        requestAnimationFrame(animateSakura);
    }

    for (let i = 0; i < 15; i++) setTimeout(createSakura, i * 100);
    setInterval(createSakura, 500);
    animateSakura();
</script>
</body>
</html>
