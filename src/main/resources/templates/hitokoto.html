    /* ==================== 樱花动画 ==================== */
    /* 读取服务端配置决定是否启用花瓣动画 */
    (function() {
        var cfg = document.getElementById('templateConfig');
        if (cfg && cfg.getAttribute('data-sakura') === 'false') return;
        /* 尊重用户系统级减少动效偏好：跳过整个樱花物理引擎启动 */
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var sakuraList = [];
        var sakuraContainer = document.getElementById('sakura-container');
        var isMobile = window.innerWidth < 640;
        var SAKURA_MAX = isMobile ? 35 : 75;
        var mouseX = -1000, mouseY = -1000;
        var mouseActive = false;    /* 鼠标是否在页面内 */
        var mouseDown = false;      /* 鼠标是否按住 */
        var windAngle = (Math.random() - 0.5) * 0.6;    /* 全局风向 */
        var windTimer = 0;
        var SCREEN_H = window.innerHeight;
        var SCREEN_W = window.innerWidth;

        document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            mouseActive = true;
        }, { passive: true });
        document.addEventListener('mouseleave', function() {
            mouseActive = false;
            mouseDown = false;
        });
        document.addEventListener('mousedown', function() {
            mouseDown = true;
        });
        document.addEventListener('mouseup', function() {
            mouseDown = false;
        });
        document.addEventListener('touchstart', function(e) {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            mouseActive = true;
            mouseDown = true;
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            mouseActive = true;
        }, { passive: true });
        document.addEventListener('touchend', function() {
            mouseActive = false;
            mouseDown = false;
        });
        document.addEventListener('touchcancel', function() {
            mouseActive = false;
            mouseDown = false;
        }, { passive: true });
        window.addEventListener('resize', function() {
            SCREEN_H = window.innerHeight;
            SCREEN_W = window.innerWidth;
        });

        /**
         * 三层深度系统：
         *   layer 0 (远): 小、慢、半透明
         *   layer 1 (中): 默认尺寸和速度
         *   layer 2 (近): 大、快、轻微模糊（景深效果）
         */
        function createSakura() {
            if (sakuraList.length >= SAKURA_MAX) return;

            var sakura = document.createElement('div');
            sakura.className = 'sakura';
            var petal = document.createElement('span');
            sakura.appendChild(petal);

            /* 深度分层 — 高密度下加大远层比例 */
            var layer = Math.random();
            var depth;
            if (layer < 0.35) depth = 0;      /* 远层 35% */
            else if (layer < 0.85) depth = 1;  /* 中层 50% */
            else depth = 2;                     /* 近层 15% */

            var size, baseSpeed, baseOpacity, blur;
            if (depth === 0) {
                size = Math.random() * 3 + 5;               /* 5-8px */
                baseSpeed = Math.random() * 0.24 + 0.18;    /* 0.18-0.42（优雅极慢） */
                baseOpacity = Math.random() * 0.18 + 0.18;  /* 0.18-0.36 */
                blur = 0;
            } else if (depth === 2) {
                size = Math.random() * 6 + 10;              /* 10-16px */
                baseSpeed = Math.random() * 0.38 + 0.46;    /* 0.46-0.84（优雅慢速） */
                baseOpacity = Math.random() * 0.18 + 0.58;  /* 0.58-0.76 */
                blur = Math.random() * 1.5 + 0.5;            /* 0.5-2px 景深模糊 */
            } else {
                size = Math.random() * 4 + 7;               /* 7-11px */
                baseSpeed = Math.random() * 0.31 + 0.32;    /* 0.32-0.63（优雅中速） */
                baseOpacity = Math.random() * 0.22 + 0.4;   /* 0.4-0.62 */
                blur = 0;
            }

            /* 移动端减速 35%，飘落更从容 */
            if (isMobile) baseSpeed *= 0.65;

            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            if (blur > 0) petal.style.filter = 'blur(' + blur.toFixed(1) + 'px)';

            /* 随机化花瓣形状 */
            var rx = Math.random() * 30 + 45;    /* 45-75% 圆角化程度 */
            var shape = Math.random();
            if (shape < 0.5) {
                petal.style.borderRadius = '50% 0 50% 50%';           /* 经典花瓣 */
            } else if (shape < 0.75) {
                petal.style.borderRadius = rx + '% 0 ' + rx + '% ' + rx + '%';  /* 变体 */
            } else {
                petal.style.borderRadius = '50% 50% 50% 0';           /* 反向 */
            }

            /* X轴集中分布：使用三次随机数之和（中心极限），
             * 约 75% 的花瓣落在中央 40% 的视口区域，
             * 剩余 25% 均匀分布在全宽，提供自然的环境氛围。 */
            var x;
            if (Math.random() < 0.78) {
                var u = (Math.random() + Math.random() + Math.random()) / 3;
                x = (u * 0.5 + 0.25) * SCREEN_W;  /* 25%-75% 高斯集中 */
            } else {
                x = Math.random() * SCREEN_W;       /* 边缘点缀 */
            }
            /* 所有花瓣统一从屏幕顶部上方飘入 */
            var y = -size * 2 - Math.random() * 120;
            var wobbleSpeed = Math.random() * 0.012 + 0.006;
            var wobbleAmountX = Math.random() * 45 + 20;      /* 20-65（更大摇摆幅度） */
            var wobbleAmountY = Math.random() * 15 + 5;       /* 5-20（垂直波动增强） */
            var rotSpeedZ = (Math.random() - 0.5) * 2.5;

            /* 初始水平漂移速度（风） */
            var driftVx = (Math.random() - 0.5) * 0.3;

            var data = {
                element: sakura,
                x: x, y: y,
                baseX: x,
                speed: baseSpeed,
                wobbleSpeed: wobbleSpeed,
                wobbleAmountX: wobbleAmountX,
                wobbleAmountY: wobbleAmountY,
                rotationZ: Math.random() * 360,           /* 平面旋转 */
                rotSpeedZ: rotSpeedZ,
                time: Math.random() * Math.PI * 2,
                size: size,
                vx: driftVx,
                vy: 0,
                opacity: baseOpacity,
                depth: depth,
                age: 0,
                scale: 1,
                burstFrames: 0,
                _lastOpacity: -1,
                _lastTransform: ''
            };

            petal.style.opacity = data.opacity;
            sakura.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotateZ(' + data.rotationZ.toFixed(1) + 'deg) scale(1)';
            sakura.style.opacity = '0';
            sakuraContainer.appendChild(sakura);

            /* 淡入 */
            requestAnimationFrame(function() {
                sakura.style.opacity = '1';
            });

            sakuraList.push(data);
        }

        function animateSakura() {
            /* 风向周期性微调 */
            windTimer++;
            if (windTimer > 300) {
                windTimer = 0;
                windAngle += (Math.random() - 0.5) * 0.5;
                windAngle = Math.max(-0.8, Math.min(0.8, windAngle));
            }

            var GRAVITY = 0.005;   /* 降低重力（0.008→0.005），飘落更优雅 */
            var WIND_FACTOR = windAngle * 0.15 * 0.02;
            var FADE_START = 0.85;
            var FADE_END = 1.02;

            for (var i = sakuraList.length - 1; i >= 0; i--) {
                var s = sakuraList[i];
                s.age++;

                /* 鼠标按住吸引：按住时花瓣朝光标方向聚拢 */
                if (mouseDown && mouseActive) {
                    var dx = s.x - mouseX;
                    var dy = s.y - mouseY;
                    var distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 250) {
                        var angle = Math.atan2(dy, dx);
                        var cosA = Math.cos(angle);
                        var sinA = Math.sin(angle);
                        var strength = (250 - distance) / 250;   /* 0→1，越近越强 */
                        var pull = strength * 1.6;
                        s.vx -= cosA * pull;
                        s.vy -= sinA * pull;
                        s.rotationZ += (Math.random() - 0.5) * strength * 12;
                    }
                }

                /* 重力 + 阻尼 */
                s.vy += GRAVITY;
                s.vx *= 0.99;
                s.vy *= 0.995;

                /* 风速（按深度加权） */
                var wf = s.depth === 0 ? 0.6 : (s.depth === 2 ? 1.4 : 1.0);
                s.vx += WIND_FACTOR * wf;

                /* 主运动 */
                s.y += s.speed + s.vy;
                s.x += s.vx;

                /* 波浪摆动 — 合并三角函数调用 */
                s.time += s.wobbleSpeed;
                var sinTime = Math.sin(s.time * 1.3);
                var cosTime = Math.cos(s.time * 0.7);
                s.x += sinTime * s.wobbleAmountX * 0.06;
                s.y += cosTime * s.wobbleAmountY * 0.04;

                /* 旋转 */
                s.rotationZ += s.rotSpeedZ;

                /* 屏幕边界环绕 */
                if (s.x < -s.size) s.x = SCREEN_W + s.size;
                if (s.x > SCREEN_W + s.size) s.x = -s.size;

                /* 绽放生长阶段：scale 0→1 渐显，同时受重力/风/摆动影响 */
                if (s.burstFrames > 0) {
                    s.burstFrames--;
                    s.scale += s.burstScaleStep;
                    if (s.scale > 1) s.scale = 1;
                }

                /* 淡出 — 避免重复 DOM 写入 */
                var fadeProgress = s.y / SCREEN_H;
                var targetOpacity = s.opacity;
                if (fadeProgress > FADE_START) {
                    var fadeRatio = Math.min(1, (fadeProgress - FADE_START) / (FADE_END - FADE_START));
                    targetOpacity = s.opacity * (1 - fadeRatio);
                }
                /* 绽放阶段：opacity 随 scale 渐显 */
                if (s.burstFrames > 0) {
                    targetOpacity *= s.scale;
                }
                if (Math.abs(targetOpacity - s._lastOpacity) > 0.012) {
                    s.element.style.opacity = targetOpacity;
                    s._lastOpacity = targetOpacity;
                }

                /* GPU 加速变换 — 平面旋转 + 绽放缩放 */
                var newTransform =
                    'translate3d(' + s.x.toFixed(1) + 'px,' + s.y.toFixed(1) + 'px,0)' +
                    ' rotateZ(' + s.rotationZ.toFixed(1) + 'deg)' +
                    ' scale(' + s.scale.toFixed(2) + ')';
                if (newTransform !== s._lastTransform) {
                    s.element.style.transform = newTransform;
                    s._lastTransform = newTransform;
                }

                /* 生命周期结束 */
                if (s.y > SCREEN_H + s.size * 3 || fadeProgress > FADE_END) {
                    s.element.remove();
                    sakuraList.splice(i, 1);
                }
            }
            requestAnimationFrame(animateSakura);
        }

        /* 点击绽放可配置参数 */
        var BURST_COUNT = 10;       /* 基础花瓣数（实际 ±3 随机） */
        var BURST_DIST_MIN = 50;   /* 最小扩散半径 (px) */
        var BURST_DIST_MAX = 130;  /* 最大扩散半径 (px) */

        /**
         * 鼠标点击绽放特效（纯 JS 驱动，无缝融入飘落系统）：
         *   花瓣从点击位置以高速扩散 → 阻尼减速 → 重力接管 → 自然飘落，
         *   全程由 animateSakura 物理引擎统一驱动，零切换、零间隙。
         */
        function createBurst(x, y) {
            var count = BURST_COUNT + Math.floor(Math.random() * 7);  /* 10-16 */
            for (var i = 0; i < count; i++) {
                (function() {
                    var sakura = document.createElement('div');
                    sakura.className = 'sakura';
                    var petal = document.createElement('span');
                    sakura.appendChild(petal);

                    var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
                    var br = (Math.random() - 0.5) * 360;
                    var size = Math.random() * 6 + 6;
                    var burstSpeed = 2.5 + Math.random() * 2.5;  /* 2.5-5.0 px/帧 高速扩散 */

                    petal.style.width = size + 'px';
                    petal.style.height = size + 'px';

                    /* 随机花瓣形状 */
                    var shape = Math.random();
                    if (shape < 0.5) {
                        petal.style.borderRadius = '50% 0 50% 50%';
                    } else if (shape < 0.75) {
                        var rx = Math.random() * 30 + 45;
                        petal.style.borderRadius = rx + '% 0 ' + rx + '% ' + rx + '%';
                    } else {
                        petal.style.borderRadius = '50% 50% 50% 0';
                    }

                    /* 初始状态：scale(0) 隐藏，位置在点击点 */
                    sakura.style.transition = 'none';
                    sakura.style.opacity = '0';
                    sakura.style.transform =
                        'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)' +
                        ' rotateZ(' + br.toFixed(1) + 'deg) scale(0)';
                    sakuraContainer.appendChild(sakura);

                    var BURST_GROW = 15;  /* 15 帧（0.25s）scale 0→1 */

                    var data = {
                        element: sakura,
                        x: x, y: y,
                        baseX: x,
                        speed: Math.random() * 0.2 + 0.15,    /* 恒定下落分量（低，靠扩散动量） */
                        wobbleSpeed: Math.random() * 0.012 + 0.006,
                        wobbleAmountX: Math.random() * 45 + 20,
                        wobbleAmountY: Math.random() * 15 + 5,
                        rotationZ: br,
                        rotSpeedZ: (Math.random() - 0.5) * 4,   /* 较快初始旋转 */
                        time: Math.random() * Math.PI * 2,
                        size: size,
                        vx: Math.cos(angle) * burstSpeed,       /* 沿扩散方向高速射出 */
                        vy: Math.sin(angle) * burstSpeed,
                        opacity: Math.random() * 0.25 + 0.55,
                        depth: 1,
                        age: 0,
                        scale: 0,
                        burstFrames: BURST_GROW,
                        burstScaleStep: 1 / BURST_GROW,
                        _lastOpacity: -1,
                        _lastTransform: ''
                    };
                    sakuraList.push(data);
                })();
            }
        }

        /* 点击触发绽放 */
        document.addEventListener('click', function(e) {
            /* 忽略交互元素上的点击 */
            if (e.target.closest('.like-btn, .next-btn, .music-btn, .submit-btn, .submit-modal, .theme-toggle, button')) return;
            createBurst(e.clientX, e.clientY);
        });

        /* 播种与密度管理 */
        var seedCount = isMobile ? 18 : 35;
        var spawnInterval = isMobile ? 1200 : 600;
        for (var i = 0; i < seedCount; i++) {
            setTimeout(createSakura, i * (isMobile ? 200 : 100));
        }
        setInterval(function() {
            /* 根据当前数量动态调整创建速率 */
            if (sakuraList.length < SAKURA_MAX * 0.7) {
                createSakura();
            }
        }, spawnInterval);
        animateSakura();
    })();
</script>
</body>
</html>
