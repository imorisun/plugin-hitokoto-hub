<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- 移动端浏览器顶栏跟随主题色（初始为暗色，applyTheme 时动态更新） -->
    <meta name="theme-color" content="#0a0606"/>
    <meta name="color-scheme" content="dark light"/>
    <title>轻言-轻拾人间辞藻，言说万千心绪</title>
    <!-- Favicon 玫瑰色花瓣 -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fb7185' d='M50 15 C70 25 85 45 75 65 C65 85 35 85 25 65 C15 45 30 25 50 15 Z' transform='rotate(45 50 50)'/%3E%3C/svg%3E"/>
    <link rel="apple-touch-icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fb7185' d='M50 15 C70 25 85 45 75 65 C65 85 35 85 25 65 C15 45 30 25 50 15 Z' transform='rotate(45 50 50)'/%3E%3C/svg%3E"/>
    <!-- Google Fonts 预连接：提前完成 DNS/TLS 握手，加速字体加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <th:block th:replace="~{hitokoto-styles :: styles}"/>
</head>
<body>
<!-- 噪点纹理 SVG 滤镜定义 -->
<svg style="display:none" aria-hidden="true">
    <filter id="noise-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
    </filter>
</svg>
<!-- 服务端配置注入，JS 通过 data 属性读取 -->
<div id="templateConfig"
     style="display:none"
     th:attr="data-theme=${templateTheme},data-sakura=${templateShowSakura},data-hint=${templateShowHint},
              data-auto-refresh=${enableAutoRefresh},data-auto-refresh-interval=${autoRefreshInterval},
              data-disable-auto-refresh=${shareView}">
</div>

<div class="bg-glow top"></div>
<div class="bg-glow"></div>
<div class="vignette"></div>
<div id="sakura-container"></div>
<div class="noise-overlay"></div>

<header>
    <div class="music-btn">LiteWords</div>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" data-tooltip="切换主题">
            <!-- 太阳图标：暗色模式下显示，点击切换到亮色 -->
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <!-- 月亮图标：亮色模式下显示，点击切换到暗色 -->
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <!-- auto 模式图标：跟随系统 -->
            <svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 2a10 10 0 0 1 0 20" fill="currentColor" opacity="0.5"/>
            </svg>
        </button>
        <!-- 自动刷新暂停/恢复按钮：仅在后端启用自动刷新时渲染；分享直达视图初始为暂停态 -->
        <button class="auto-refresh-toggle" id="autoRefreshToggle" type="button"
                th:if="${enableAutoRefresh == true}"
                aria-label="暂停自动切换" data-tooltip="暂停自动切换"
                aria-pressed="false">
            <!-- 倒计时光环：圆弧从顶部顺时针递减，指示距下次自动切换的剩余时间 -->
            <svg class="auto-refresh-ring" viewBox="0 0 40 40" aria-hidden="true">
                <circle class="auto-refresh-ring__track" cx="20" cy="20" r="18"/>
                <circle class="auto-refresh-ring__progress" cx="20" cy="20" r="18"/>
            </svg>
            <!-- 暂停图标：自动刷新运行中显示 -->
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="4" width="4" height="16" rx="1"/>
                <rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
            <!-- 播放图标：暂停时显示 -->
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="6,4 20,12 6,20"/>
            </svg>
        </button>
        <!-- 分类切换按钮：点击展开分类下拉，选择后随机句子仅从该分类获取 -->
        <button class="category-toggle" id="categoryToggle" type="button"
                aria-label="切换分类" data-tooltip="分类">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="4" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <!-- 分享按钮：点击打开分享弹窗，分享当前展示的句子 -->
        <button class="share-btn" id="shareBtn" type="button"
                aria-label="分享句子" data-tooltip="分享">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
        </button>
        <button class="submit-btn" id="submitBtn" type="button" aria-label="提交句子">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>投递句子</span>
        </button>
        <button class="like-btn" id="likeBtn" type="button" aria-label="点赞">
            <svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="like-count" id="likeCount">0</span>
        </button>
    </div>
</header>

<main>
    <!-- 分享链接直达的句子（?sentence=xxx）优先渲染；否则渲染默认随机句子（三元条件惰性求值，避免无谓调用 randomSentences） -->
    <div class="quote-container" id="quoteContainer"
         th:each="s : ${sharedSentence != null ? sharedSentence : hitokotoFinder.randomSentences(1, null)}"
         th:attr="data-name=${s.name}, data-likes=${s.likeCount}, data-jump-url=${s.jumpUrl}"
         th:classappend="${s.jumpUrl} ? 'quote-container--clickable'"
         aria-live="polite" aria-atomic="true"
         aria-label="当前句子">
        <h1 class="quote-text" id="quoteText" th:text="${s.content}">加载中...</h1>
        <p class="quote-author" id="quoteAuthor"
           th:attr="data-author=${s.author}, data-source=${s.source}"
           th:text="${s.author} ? ${s.author} + (${s.source} ? ' · ' + ${s.source} : '') : '佚名'">
        </p>
    </div>
</main>

<footer>
    <button class="next-btn" id="nextBtn" type="button">
        Next
        <span class="line"></span>
    </button>
</footer>

<div class="toast" id="toast"></div>

<!-- 访客提交句子弹窗 -->
<div class="submit-modal" id="submitModal" role="dialog" aria-modal="true" aria-labelledby="submitModalTitle">
    <div class="submit-modal__backdrop" id="submitModalBackdrop"></div>
    <div class="submit-modal__card">
        <div class="submit-modal__header">
            <div class="submit-modal__title" id="submitModalTitle">投递一句</div>
            <button class="submit-modal__close" id="submitModalClose" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <form id="submitForm" autocomplete="off">
            <div class="submit-field">
                <label class="submit-field__label" for="submitContent">
                    句子内容<span class="required">*</span>
                </label>
                <textarea
                        class="submit-field__textarea"
                        id="submitContent"
                        name="content"
                        maxlength="500"
                        required
                        placeholder="写下你想分享的那一句话..."
                        rows="4"
                ></textarea>
                <span class="submit-field__count"><span id="submitContentCount">0</span> / 500</span>
            </div>
            <div class="submit-field">
                <label class="submit-field__label">分类<span class="required">*</span></label>
                <div class="custom-select" id="submitCategorySelect">
                    <div class="custom-select__trigger" id="submitCategoryTrigger" tabindex="0">
                        <span class="custom-select__value custom-select__value--placeholder" id="submitCategoryLabel">加载中...</span>
                        <svg class="custom-select__arrow" viewBox="0 0 24 24">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <input type="hidden" id="submitCategory" value="">
            </div>
            <div class="submit-field">
                <label class="submit-field__label" for="submitAuthor">作者</label>
                <input
                        class="submit-field__input"
                        id="submitAuthor"
                        name="author"
                        type="text"
                        maxlength="50"
                        placeholder="留空则记为匿名"
                >
            </div>
            <div class="submit-field">
                <label class="submit-field__label" for="submitSource">来源</label>
                <input
                        class="submit-field__input"
                        id="submitSource"
                        name="source"
                        type="text"
                        maxlength="100"
                        placeholder="如书名、电影、歌曲等"
                >
            </div>
            <div class="submit-field">
                <label class="submit-field__label" for="submitterName">你的昵称</label>
                <input
                        class="submit-field__input"
                        id="submitterName"
                        name="submitterName"
                        type="text"
                        maxlength="50"
                        placeholder="让管理员知道是谁投递的"
                >
            </div>
            <div class="submit-modal__footer">
                <button class="submit-modal__btn" type="button" id="submitCancel">取消</button>
                <button class="submit-modal__btn submit-modal__btn--primary" type="submit" id="submitConfirm" disabled>
                    投递
                </button>
            </div>
        </form>
    </div>
</div>

<div class="custom-select__dropdown" id="submitCategoryDropdown"></div>
<!-- 分类切换下拉面板 -->
<div class="category-dropdown" id="categoryDropdown" role="menu" aria-label="分类选择"></div>

<!-- 分享弹窗 -->
<div class="share-modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-modal__backdrop" id="shareModalBackdrop"></div>
    <div class="share-modal__card">
        <div class="share-modal__header">
            <div class="share-modal__title" id="shareModalTitle">分享句子</div>
            <button class="share-modal__close" id="shareModalClose" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <!-- 分享卡片预览 -->
        <div class="share-preview" id="sharePreview">
            <img class="share-preview__card" id="shareCardPreview" alt="分享卡片预览"/>
            <div class="share-preview__loading" id="shareCardLoading">卡片生成中...</div>
            <div class="share-preview__error" id="shareCardError">卡片生成失败，请稍后重试</div>
            <button class="share-theme-toggle" id="shareThemeToggle" type="button"
                    aria-label="切换卡片日间/夜间主题" data-tooltip="切换卡片主题">
                <!-- 太阳图标：夜间卡片显示，点击切到日间 -->
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <!-- 月亮图标：日间卡片显示，点击切到夜间 -->
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
        <!-- 分享选项 -->
        <div class="share-options" id="shareOptions">
            <button class="share-option" id="shareCopyLink" type="button" aria-label="复制分享链接">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                <span>复制链接</span>
            </button>
            <button class="share-option" id="shareDownloadCard" type="button" aria-label="保存分享卡片图片">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>保存图片</span>
            </button>
            <button class="share-option" id="shareCopyText" type="button" aria-label="复制句子内容">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>复制内容</span>
            </button>
        </div>
        <div class="share-modal__footer">
            <button class="share-modal__btn" type="button" id="shareModalCancel">关闭</button>
        </div>
    </div>
</div>
<th:block th:replace="~{hitokoto-scripts :: scripts}"/>
</body>
</html>
